<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notification iframe census child</title>
</head>
<body>
<script>
/* Cross-origin census child: reports the Notification surface + permission
 * state from inside a cross-origin frame. No calls, no requests — census only. */
const q = new URLSearchParams(location.search);
const parentOrigin = q.get('parent') || '*';
const has = typeof Notification === 'function';
const census = {
  type: 'notif-census',
  has: has,
  perm: has ? Notification.permission : 'absent',
  max: (has && 'maxActions' in Notification) ? Notification.maxActions : 'none',
  secure: window.isSecureContext
};
try { parent.postMessage(census, parentOrigin === '*' ? '*' : parentOrigin); } catch (e) {}
</script>
</body>
</html>
