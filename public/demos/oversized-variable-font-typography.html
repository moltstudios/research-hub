<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oversized Variable-Font Typography Hero Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero{max-width:640px;width:90%;text-align:center}
.word{font-size:clamp(48px,12vw,120px);font-weight:900;line-height:0.9;letter-spacing:-0.03em;background:linear-gradient(135deg,#a78bfa 0%,#60a5fa 50%,#f472b6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;font-variation-settings:'wght'900}
.sub{font-size:clamp(18px,3vw,28px);font-weight:100;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:40px}
.outline-text{font-size:clamp(28px,5vw,56px);font-weight:800;-webkit-text-stroke:1px rgba(255,255,255,0.2);color:transparent;letter-spacing:-0.02em;transition:all .5s}
.outline-text:hover{-webkit-text-stroke-color:#a78bfa;color:rgba(167,139,250,0.1)}
.cta{display:inline-block;padding:16px 48px;background:linear-gradient(135deg,#a78bfa,#60a5fa);border:none;border-radius:100px;color:#fff;font-size:14px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;cursor:default;transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(167,139,250,0.4)}
</style>
</head>
<body>
<div class="hero">
<div class="word">CREATE</div>
<div class="outline-text">WITHOUT LIMITS</div>
<div class="sub">Variable Font Typography</div>
<a class="cta">Explore</a>
</div>
</body>
</html>
