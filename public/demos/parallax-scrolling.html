<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Scrolling Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #0a0a1a; color: #fff; }
.parallax-container { height: 100vh; overflow-x: hidden; overflow-y: auto; perspective: 10px; }
.layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.bg-layer { transform: translateZ(-8px) scale(1.8); }
.bg-layer .stars { position: absolute; inset: 0; }
.bg-layer .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; }
.mid-layer { transform: translateZ(-4px) scale(1.4); }
.mid-layer .orb { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(167,139,250,0.3), transparent); filter: blur(40px); position: absolute; }
.front-layer { transform: translateZ(-2px) scale(1.2); }
.front-layer .orb { width: 120px; height: 120px; border-radius: 50%; position: absolute; }
.front-layer .orb:nth-child(1) { background: rgba(96,165,250,0.15); top: 30%; left: 20%; }
.front-layer .orb:nth-child(2) { background: rgba(244,114,182,0.12); top: 50%; right: 25%; }
.hero { position: relative; z-index: 10; min-height: 200vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
.hero h1 { font-size: clamp(36px, 8vw, 64px); font-weight: 800; margin-bottom: 16px; background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { font-size: 18px; color: rgba(255,255,255,0.5); max-width: 480px; line-height: 1.6; }
.scroll-indicator { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
</style>
</head>
<body>
<div class="parallax-container" id="container">
  <div class="layer bg-layer">
    <div class="stars" id="stars"></div>
  </div>
  <div class="layer mid-layer">
    <div class="orb" style="top:20%;left:30%"></div>
    <div class="orb" style="bottom:30%;right:20%"></div>
  </div>
  <div class="layer front-layer">
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
  <div class="hero">
    <h1>Parallax Scrolling</h1>
    <p>Multiple layers moving at different speeds create a sense of depth and immersion.</p>
  </div>
</div>
<div class="scroll-indicator">Scroll down ↓</div>
<script>
const stars = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
  s.style.opacity = 0.3 + Math.random() * 0.7;
  stars.appendChild(s);
}
</script>
</body>
</html>
