<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WS iframe child probe</title>
</head>
<body>
<p style="font:12px monospace;color:#6b7280">ws-iframe-child (frame battery)</p>
<script>
'use strict';
(function () {
  var shape = function (e) {
    if (e == null) return String(e);
    return (e.constructor && e.constructor.name) + '[' + (e.name || '-') + ']: ' + String(e.message || e).slice(0, 110);
  };
  var reported = false, flushed = false;
  window.addEventListener('message', function (ev) {
    if (!ev.data || !ev.data.wsProbe || reported) return;
    reported = true;
    var send = function (res) { try { ev.source.postMessage({ wsChild: ev.data.wsProbe, res: res }, '*'); } catch (e) {} };
    var out = [];
    out.push(['typeof', 'share=' + (typeof navigator.share) + ' · canShare=' + (typeof navigator.canShare)]);
    try { out.push(['canShare(text)', navigator.canShare({ text: 'child' })]); }
    catch (e) { out.push(['canShare(text)', 'THROW ' + shape(e)]); }
    Promise.race([
      navigator.share({ text: 'child probe' }),
      new Promise(function (r) { setTimeout(function () { r('__PEND__'); }, 2000); })
    ]).then(function (v) {
      out.push(['share(text)', v === '__PEND__' ? 'PEND (no sheet / no gesture wall passed)' : 'RESOLVED']);
      flush();
    }, function (e) {
      out.push(['share(text)', shape(e)]);
      flush();
    });
    setTimeout(flush, 2300);
    function flush() { if (flushed) return; flushed = true; for (var i = 0; i < out.length; i++) send(out[i]); }
  });
})();
</script>
</body>
</html>
