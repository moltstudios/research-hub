<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Lead-Capture Tools Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#fafaf8;color:#1a1a1a;min-height:100vh;padding:40px 24px}
.container{max-width:540px;margin:0 auto}
h1{font-size:28px;font-weight:700;margin-bottom:8px}
p.sub{font-size:14px;color:#888;margin-bottom:32px}
.lead-tool{background:#fff;border-radius:20px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06)}
.lead-tool h3{font-size:18px;font-weight:600;margin-bottom:24px;text-align:center}
.calc{display:flex;flex-direction:column;gap:16px}
.calc label{font-size:13px;font-weight:600;color:#64748b;display:block;margin-bottom:6px}
.calc input{width:100%;padding:12px 16px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none;transition:border-color .2s}
.calc input:focus{border-color:#8b5cf6}
.calc input[type="range"]{-webkit-appearance:none;width:100%;height:6px;background:#e2e8f0;border-radius:3px;outline:none}
.calc input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#8b5cf6;border-radius:50%;cursor:pointer}
.result{background:#f8fafc;border-radius:12px;padding:20px;margin-top:16px}
.result .label{font-size:12px;color:#64748b;margin-bottom:4px}
.result .value{font-size:32px;font-weight:800;color:#8b5cf6}
.btn-submit{width:100%;padding:14px;background:#8b5cf6;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;margin-top:16px;cursor:default}
.lead-form{margin-top:24px;border-top:1px solid #e2e8f0;padding-top:24px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:12px}
.form-group label{font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:6px}
.form-group input{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none}
</style>
</head>
<body>
<div class="container">
<h1>Interactive Lead-Capture</h1>
<p class="sub">Calculators and quizzes that capture qualified leads</p>

<div class="lead-tool">
<h3>Project Cost Calculator</h3>
<div class="calc">
<label>Project Type</label>
<select style="width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;background:#fff">
<option>Website Design</option><option>E-commerce</option><option>App Development</option>
</select>
<label>Complexity Level: <span id="complexityVal">Medium</span></label>
<input type="range" min="1" max="3" value="2" oninput="updateCalc()">
<label>Features Needed</label>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:0"><input type="checkbox"> CMS</label>
<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:0"><input type="checkbox"> E-commerce</label>
<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:0"><input type="checkbox"> SEO</label>
<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:0"><input type="checkbox"> Analytics</label>
</div>
</div>
<div class="result">
<div class="label">Estimated Investment</div>
<div class="value" id="resultVal">$12,500</div>
</div>
<button class="btn-submit">Get Detailed Quote</button>

<div class="lead-form" id="leadForm" style="display:none">
<div class="form-row">
<div class="form-group"><label>Name</label><input type="text" placeholder="Your name"></div>
<div class="form-group"><label>Email</label><input type="email" placeholder="you@company.com"></div>
</div>
<div class="form-group"><label>Company</label><input type="text" placeholder="Company name"></div>
<button class="btn-submit">Send My Quote</button>
</div>
</div>
</div>
<script>
function updateCalc() {
  const slider = document.querySelector('input[type="range"]');
  const labels = ['Basic', 'Medium', 'Advanced'];
  document.getElementById('complexityVal').textContent = labels[slider.value - 1];
  const base = [8000, 15000, 35000][slider.value - 1];
  const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
  const extra = checkboxes.length * 1500;
  document.getElementById('resultVal').textContent = '$' + (base + extra).toLocaleString();
}
document.querySelector('.btn-submit').onclick = function() {
  if (this.textContent === 'Get Detailed Quote') {
    document.getElementById('leadForm').style.display = 'block';
    this.style.display = 'none';
  }
};
</script>
</body>
</html>
