<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightweight 3D / Immersive Web Elements Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;padding:40px 24px}
.container{max-width:540px;margin:0 auto}
h1{font-size:28px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p.sub{font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:32px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px;text-align:center;transition:transform .3s,box-shadow .3s;cursor:default}
.card:hover{transform:translateY(-4px) rotateX(5deg);box-shadow:0 12px 40px rgba(167,139,250,0.2)}
.card .icon{font-size:48px;margin-bottom:12px;display:inline-block;animation:float 3s ease-in-out infinite}
.card:nth-child(2) .icon{animation-delay:.5s}.card:nth-child(3) .icon{animation-delay:1s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.card p{font-size:12px;color:rgba(255,255,255,0.4)}
.perspective-stage{background:rgba(255,255,255,0.03);border-radius:20px;padding:32px;margin-top:24px;perspective:600px}
.cube-wrap{width:120px;height:120px;margin:0 auto;transform-style:preserve-3d;animation:rotate3d 10s linear infinite}
@keyframes rotate3d{from{transform:rotateX(-20deg)rotateY(0)}to{transform:rotateX(-20deg)rotateY(360deg)}}
.face{position:absolute;width:120px;height:120px;border:2px solid rgba(167,139,250,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;backdrop-filter:blur(4px)}
.front{background:rgba(167,139,250,0.1);transform:translateZ(60px)}
.back{background:rgba(96,165,250,0.1);transform:rotateY(180deg)translateZ(60px)}
.right{background:rgba(244,114,182,0.1);transform:rotateY(90deg)translateZ(60px)}
.left{background:rgba(52,211,153,0.1);transform:rotateY(-90deg)translateZ(60px)}
</style>
</head>
<body>
<div class="container">
<h1>Lightweight 3D</h1>
<p class="sub">Immersive depth using CSS 3D transforms — no WebGL needed</p>

<div class="card-grid">
<div class="card"><div class="icon">🎮</div><h3>Interactive</h3><p>Responds to cursor</p></div>
<div class="card"><div class="icon">📦</div><h3>Spatial</h3><p>Real 3D depth</p></div>
<div class="card"><div class="icon">⚡</div><h3>Fast</h3><p>60fps guaranteed</p></div>
<div class="card"><div class="icon">📱</div><h3>Mobile</h3><p>Battery-friendly</p></div>
</div>

<div class="perspective-stage">
<div class="cube-wrap">
<div class="face front">⚡</div><div class="face back">🎨</div>
<div class="face right">🚀</div><div class="face left">💎</div>
</div>
</div>
</div>
</body>
</html>
