<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pointer Lock iframe child</title>
<link rel="icon" href="data:,">
<style>
body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;background:#eef2ff;color:#3730a3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:160px}
button{font:600 13px/1.2 inherit;color:#fff;background:#4338ca;border:none;border-radius:8px;padding:9px 14px;cursor:pointer}
#out{font-family:ui-monospace,monospace;font-size:11px;max-width:92%;overflow-wrap:anywhere}
</style>
</head>
<body>
<div>🔒 child pointer-lock booth</div>
<button id="kid">Lock from inside iframe</button>
<div id="out">idle</div>
<script>
(function(){
const q = new URLSearchParams(location.search);
const tag = q.get('tag') || 'anon';
const out = document.getElementById('out');
let errEvent = false;
document.addEventListener('pointerlockerror', () => { errEvent = true; });
function post(m){ try { parent.postMessage(Object.assign({kind:'pl-child', tag}, m), '*'); } catch(e){} }
document.getElementById('kid').addEventListener('click', async () => {
  let msg = {clicked:true};
  try {
    const p = document.body.requestPointerLock();
    if (p && p.then) await Promise.race([p.then(()=>{msg.result='resolved';}), p.catch(e=>{msg.result='rejected'; msg.name=e.name; msg.message=String(e.message).slice(0,120);}), new Promise(r=>setTimeout(()=>{msg.result='pending-timeout'; r();},2000))]);
    else msg.result = 'no-promise';
  } catch(e){ msg.result='sync-throw'; msg.name=e.name; msg.message=String(e.message).slice(0,120); }
  await new Promise(r=>setTimeout(r,150));
  msg.locked = document.pointerLockElement === document.body;
  msg.errEvent = errEvent;
  if (msg.locked){ document.exitPointerLock(); }
  out.textContent = `${tag}: ${msg.result}${msg.name?':'+msg.name:''} locked=${msg.locked} errEvent=${errEvent}`;
  post(msg);
});
post({kind:'pl-child', tag, loaded:true});
})();
</script>
</body>
</html>
