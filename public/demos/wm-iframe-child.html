<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>wm child</title></head>
<body><script>
// Window Management demo — iframe child. Reports its own census via postMessage.
const tag = new URLSearchParams(location.search).get('tag') || 'same';
window.addEventListener('message', async (ev) => {
  if (ev.data !== 'go') return;
  const out = { tag, origin: location.origin, hasAPI: typeof window.getScreenDetails };
  if (typeof window.getScreenDetails !== 'function') {
    out.result = 'API absent on this origin';
    parent.postMessage(out, '*');
    return;
  }
  try {
    const d = await Promise.race([
      window.getScreenDetails(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('PEND-IFRAME')), 2500)),
    ]);
    out.result = 'resolved screens=' + d.screens.length;
  } catch (e) {
    out.result = 'rejected ' + e.name + ': ' + String(e.message).slice(0, 110);
  }
  parent.postMessage(out, '*');
});
</script></body>
</html>
