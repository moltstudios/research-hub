<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>camera child</title>
<link rel="icon" href="data:,">
<style>
  body { font: 12px ui-monospace, monospace; margin: 0; padding: 8px 10px; background: #faf9f7; color: #1a1a1e; }
  #r { color: #6b6b76; }
</style>
</head>
<body>
<div>child (<span id="org">…</span>) — <span id="r">probing getUserMedia…</span></div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const slot = q.get('slot') || 'same';
  document.getElementById('org').textContent = location.host;
  navigator.mediaDevices.getUserMedia({ video: true }).then(s => {
    const t = s.getVideoTracks()[0];
    const rep = { ok: true, label: t.label, w: t.getSettings().width, h: t.getSettings().height };
    t.stop(); s.getTracks().forEach(t => t.stop());
    document.getElementById('r').textContent = 'GRANTED ' + rep.w + '×' + rep.h + ' "' + rep.label + '"';
    parent.postMessage({ __camChild: true, slot, report: rep }, '*');
  }).catch(e => {
    const rep = { ok: false, err: e.name + ': ' + (e.message || '').slice(0, 60) };
    document.getElementById('r').textContent = rep.err;
    try { parent.postMessage({ __camChild: true, slot, report: rep }, '*'); } catch (_) {}
  });
})();
</script>
</body>
</html>
