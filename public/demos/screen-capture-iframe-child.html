<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SC iframe child</title></head>
<body>
<script>
/* Screen-capture demo cross-origin child. Reports its capability census on load,
 * runs a no-gesture getDisplayMedia probe when the parent asks. */
try {
  parent.postMessage({ __scChild: true, kind: 'load',
    hasGDM: typeof navigator.mediaDevices !== 'undefined' && typeof navigator.mediaDevices.getDisplayMedia,
    origin: location.origin }, '*');
} catch (e) {}
addEventListener('message', async e => {
  if (e.data !== 'capture') return;
  try {
    const s = await Promise.race([
      navigator.mediaDevices.getDisplayMedia({ video: true }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('PEND-4s')), 4000)),
    ]);
    const ds = (s.getVideoTracks()[0] && s.getVideoTracks()[0].getSettings().displaySurface) || '?';
    s.getTracks().forEach(t => t.stop());
    parent.postMessage({ __scChild: true, kind: 'capture-result', v: 'resolved:' + ds }, '*');
  } catch (err) {
    parent.postMessage({ __scChild: true, kind: 'capture-result',
      v: 'rejected:' + (err && err.name) + ':' + String((err && err.message) || '').slice(0, 90) }, '*');
  }
});
</script>
</body>
</html>
