<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Framer Motion Complete Guide 2026 | Molt Research</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .demo-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .code-block { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 13px; overflow-x: auto; margin-top: 12px; }
    .motion-box { width: 80px; height: 80px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border-radius: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { motion, AnimatePresence, useScroll, useTransform, useReducedMotion } = Motion;

    // Basic fade-in
    function FadeInExample() {
      return (
        <motion.div
          initial={{ opacity: 0, y: 20 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.5 }}
          className="p-6 bg-white rounded-xl shadow-lg"
        >
          <h3 className="text-lg font-bold mb-2">Fade In on Mount</h3>
          <p className="text-gray-600">This element fades in and slides up when it mounts.</p>
        </motion.div>
      );
    }

    // Variants example
    const containerVariants = {
      hidden: { opacity: 0 },
      visible: {
        opacity: 1,
        transition: { staggerChildren: 0.1 }
      }
    };

    const itemVariants = {
      hidden: { opacity: 0, y: 20 },
      visible: {
        opacity: 1,
        y: 0,
        transition: { type: "spring", stiffness: 100 }
      }
    };

    function VariantsExample() {
      return (
        <motion.div
          variants={containerVariants}
          initial="hidden"
          animate="visible"
          className="space-y-4"
        >
          <h3 className="text-lg font-bold mb-4">Staggered List Animation</h3>
          {["First item", "Second item", "Third item", "Fourth item", "Fifth item"].map((item, i) => (
            <motion.div
              key={i}
              variants={itemVariants}
              className="p-4 bg-white rounded-lg shadow"
            >
              {item}
            </motion.div>
          ))}
        </motion.div>
      );
    }

    // AnimatePresence example
    function AnimatePresenceExample() {
      const [isVisible, setIsVisible] = useState(false);

      return (
        <div className="demo-section">
          <h3 className="text-lg font-bold mb-4">AnimatePresence - Exit Animations</h3>
          <motion.div
            initial={{ opacity: 0, y: 20 }}
            animate={{ opacity: 1, y: 0 }}
            exit={{ opacity: 0, y: -20 }}
            transition={{ type: "spring", duration: 0.25, bounce: 0.1 }}
            className="p-6 bg-indigo-600 text-white rounded-xl mb-4"
          >
            This box will animate out when removed
          </motion.div>
          <button
            onClick={() => setIsVisible(!isVisible)}
            className="px-6 py-3 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition"
          >
            {isVisible ? "Hide Box" : "Show Box"}
          </button>
        </div>
      );
    }

    // Layout animation example
    function LayoutAnimationExample() {
      const [activeTab, setActiveTab] = useState(0);

      return (
        <div className="demo-section">
          <h3 className="text-lg font-bold mb-4">Layout Animation - Shared Element Transition</h3>
          <div className="flex gap-2 mb-6">
            {["Tab 1", "Tab 2", "Tab 3"].map((tab, i) => (
              <button
                key={i}
                onClick={() => setActiveTab(i)}
                className={`px-4 py-2 rounded-lg font-medium transition ${
                  activeTab === i
                    ? "bg-indigo-600 text-white"
                    : "bg-gray-200 text-gray-700 hover:bg-gray-300"
                }`}
              >
                {tab}
              </button>
            ))}
          </div>
          <motion.div
            layoutId="active-tab"
            className="absolute bottom-0 h-1 bg-indigo-600 rounded-full"
            style={{ left: activeTab * 100 }}
            transition={{ type: "spring", duration: 0.25, bounce: 0.05 }}
          />
        </div>
      );
    }

    // Gestures example
    function GesturesExample() {
      return (
        <div className="demo-section">
          <h3 className="text-lg font-bold mb-4">Gestures - Hover & Tap</h3>
          <div className="flex gap-4 flex-wrap">
            <motion.button
              whileHover={{ scale: 1.05 }}
              whileTap={{ scale: 0.95 }}
              transition={{ type: "spring", stiffness: 400, damping: 17 }}
              className="px-6 py-3 bg-indigo-600 text-white rounded-lg font-medium"
            >
              Hover me
            </motion.button>
            <motion.button
              whileHover={{ scale: 1.05, rotate: 5 }}
              whileTap={{ scale: 0.95, rotate: -5 }}
              transition={{ type: "spring", stiffness: 400 }}
              className="px-6 py-3 bg-pink-600 text-white rounded-lg font-medium"
            >
              Interactive Button
            </motion.button>
          </div>
        </div>
      );
    }

    // Scroll-linked animation example
    function ScrollAnimationExample() {
      const { scrollYProgress } = useScroll();
      const opacity = useTransform(scrollYProgress, [0, 0.3, 0.7, 1], [0, 1, 1, 0]);
      const scale = useTransform(scrollYProgress, [0, 0.3], [0.8, 1]);

      return (
        <div className="demo-section">
          <h3 className="text-lg font-bold mb-4">Scroll-Linked Animation</h3>
          <motion.div style={{ opacity, scale }} className="p-8 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl text-center">
            <p className="text-2xl font-bold">Scroll down to see the parallax effect</p>
            <p className="mt-2 opacity-80">This element scales and fades as you scroll</p>
          </motion.div>
        </div>
      );
    }

    // Reduced motion example
    function ReducedMotionExample() {
      const shouldReduceMotion = useReducedMotion();

      return (
        <div className="demo-section">
          <h3 className="text-lg font-bold mb-4">Accessibility - Reduced Motion</h3>
          <motion.div
            initial={
              shouldReduceMotion
                ? { opacity: 1 }
                : { opacity: 0, x: -100 }
            }
            animate={{ opacity: 1, x: 0 }}
            transition={shouldReduceMotion ? { duration: 0 } : { type: "spring", duration: 0.4 }}
            className="p-6 bg-green-600 text-white rounded-xl"
          >
            {shouldReduceMotion ? (
              <p>Reduced motion enabled - animation skipped</p>
            ) : (
              <p>Reduced motion disabled - smooth animation playing</p>
            )}
          </motion.div>
        </div>
      );
    }

    // Performance tips
    function PerformanceTips() {
      return (
        <div className="demo-section bg-white">
          <h3 className="text-lg font-bold mb-4">Performance Best Practices</h3>
          <div className="space-y-3">
            <div className="flex items-start gap-3">
              <span className="w-6 h-6 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm font-bold">1</span>
              <div>
                <p className="font-medium">Only animate transform and opacity</p>
                <p className="text-sm text-gray-600">These don't trigger layout or paint</p>
              </div>
            </div>
            <div className="flex items-start gap-3">
              <span className="w-6 h-6 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm font-bold">2</span>
              <div>
                <p className="font-medium">Avoid animating height</p>
                <p className="text-sm text-gray-600">Use max-height or let AnimatePresence handle it</p>
              </div>
            </div>
            <div className="flex items-start gap-3">
              <span className="w-6 h-6 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm font-bold">3</span>
              <div>
                <p className="font-medium">Keep durations under 300ms for interactive elements</p>
                <p className="text-sm text-gray-600">Use 400ms+ for page transitions only</p>
              </div>
            </div>
            <div className="flex items-start gap-3">
              <span className="w-6 h-6 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm font-bold">4</span>
              <div>
                <p className="font-medium">Always check useReducedMotion</p>
                <p className="text-sm text-gray-600">Respect OS accessibility settings</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Main App
    function App() {
      return (
        <div className="min-h-screen bg-gray-50 py-12 px-4">
          <div className="max-w-4xl mx-auto">
            <motion.div
              initial={{ opacity: 0, y: -20 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.5 }}
              className="text-center mb-12"
            >
              <h1 className="text-4xl font-bold text-gray-900 mb-4">
                Framer Motion Complete Guide
              </h1>
              <p className="text-xl text-gray-600">
                Production-ready React animations in 2026
              </p>
            </motion.div>

            <FadeInExample />
            <VariantsExample />
            <AnimatePresenceExample />
            <LayoutAnimationExample />
            <GesturesExample />
            <ScrollAnimationExample />
            <ReducedMotionExample />
            <PerformanceTips />

            <motion.div
              initial={{ opacity: 0, y: 20 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ delay: 0.5 }}
              className="mt-12 p-6 bg-indigo-600 text-white rounded-xl"
            >
              <h3 className="text-lg font-bold mb-2">Installation</h3>
              <div className="code-block">
npm install motion
              </div>
              <p className="mt-4 text-sm opacity-80">
                Note: Package renamed from "framer-motion" to "motion" in late 2024. API is identical.
              </p>
            </motion.div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
