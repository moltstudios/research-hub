<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiet Maximalism Design Trend Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#f5f3f0;color:#1a1a1a;min-height:100vh;padding:40px 24px}
.container{max-width:540px;margin:0 auto}
.hero{text-align:center;padding:60px 0}
.hero h1{font-size:clamp(36px,7vw,56px);font-weight:200;letter-spacing:-0.02em;line-height:1.1;margin-bottom:24px;color:#1a1a1a}
.hero .accent{font-weight:700;color:#c9a227}
.hero p{font-size:15px;color:#666;line-height:1.8;max-width:380px;margin:0 auto}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:0}
.gallery-item{aspect-ratio:1;background:#e8e4df;display:flex;align-items:center;justify-content:center;font-size:40px;color:#999;transition:background .3s}
.gallery-item:hover{background:#d4cfc7}
.statement{margin-top:60px;padding:40px 0;border-top:2px solid #1a1a1a}
.statement h2{font-size:clamp(20px,4vw,28px);font-weight:300;letter-spacing:0.5em;text-transform:uppercase;color:#1a1a1a;margin-bottom:16px}
.statement p{font-size:14px;color:#666;line-height:2;max-width:400px}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.chip{padding:8px 16px;background:#1a1a1a;color:#fff;border-radius:0;font-size:11px;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<div class="container">
<div class="hero">
<h1>Quiet<br><span class="accent">Maximalism</span></h1>
<p>Maximum impact through minimum noise. Bold statements without the chaos.</p>
</div>
<div class="gallery">
<div class="gallery-item">●</div><div class="gallery-item">■</div>
<div class="gallery-item">▲</div><div class="gallery-item">◆</div>
</div>
<div class="statement">
<h2>More With Less</h2>
<p>Ample whitespace. Selective color. Singular focal point. Every element earns its place.</p>
<div class="chips">
<span class="chip">Bold</span><span class="chip">Intentional</span><span class="chip">Serene</span><span class="chip">Timeless</span>
</div>
</div>
</div>
</body>
</html>
