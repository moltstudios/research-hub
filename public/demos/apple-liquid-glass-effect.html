<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Liquid Glass Effect Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.liquid-glass{width:100%;max-width:380px;background:rgba(255,255,255,0.03);border-radius:32px;padding:40px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
.liquid-glass::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,0.1),transparent 30%);animation:rotate 6s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
.liquid-glass::after{content:'';position:absolute;inset:2px;background:rgba(0,0,0,0.9);border-radius:30px;z-index:0}
.content{position:relative;z-index:1}
h1{font-size:28px;font-weight:600;margin-bottom:8px;background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,0.6) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:24px;line-height:1.6}
.feature{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.feature .icon{width:40px;height:40px;background:rgba(255,255,255,0.1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.feature div h4{font-size:14px;font-weight:500;margin-bottom:2px}
.feature div p{font-size:12px;margin:0}
.orb{position:absolute;width:100px;height:100px;background:radial-gradient(circle,rgba(147,51,234,0.3),transparent);border-radius:50%;filter:blur(40px);top:-30px;right:-30px;animation:float 4s ease-in-out infinite}
.orb2{position:absolute;width:80px;height:80px;background:radial-gradient(circle,rgba(59,130,246,0.25),transparent);border-radius:50%;filter:blur(35px);bottom:-20px;left:-20px;animation:float 5s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-10px)}}
</style>
</head>
<body>
<div class="liquid-glass">
<div class="orb"></div><div class="orb2"></div>
<div class="content">
<h1>Liquid Glass</h1>
<p>The signature Apple effect — frosted glass with animated light refraction.</p>
<div class="feature">
<div class="icon">✨</div><div><h4>Refraction</h4><p>Animated light edges</p></div>
</div>
<div class="feature">
<div class="icon">🎨</div><div><h4>Blur</h4><p>Deep backdrop blur</p></div>
</div>
<div class="feature">
<div class="icon">💎</div><div><h4>Depth</h4><p>Layered glass effects</p></div>
</div>
</div>
</div>
</body>
</html>
