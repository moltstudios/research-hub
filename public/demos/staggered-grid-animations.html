<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staggered Grid Animations Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; padding: 40px 24px; }
h1 { text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p.sub { text-align: center; font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 32px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; max-width: 640px; margin: 0 auto; }
.cell { aspect-ratio: 1; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 28px; opacity: 0; transform: translateY(20px) scale(0.9); animation: staggerIn 0.5s ease forwards; cursor: default; transition: transform 0.2s, box-shadow 0.2s; }
.cell:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
@keyframes staggerIn { to { opacity: 1; transform: translateY(0) scale(1); } }
.cell:nth-child(1) { animation-delay: 0.05s; }
.cell:nth-child(2) { animation-delay: 0.1s; }
.cell:nth-child(3) { animation-delay: 0.15s; }
.cell:nth-child(4) { animation-delay: 0.2s; }
.cell:nth-child(5) { animation-delay: 0.25s; }
.cell:nth-child(6) { animation-delay: 0.3s; }
.cell:nth-child(7) { animation-delay: 0.35s; }
.cell:nth-child(8) { animation-delay: 0.4s; }
.cell:nth-child(9) { animation-delay: 0.45s; }
.cell:nth-child(10) { animation-delay: 0.5s; }
.cell:nth-child(11) { animation-delay: 0.55s; }
.cell:nth-child(12) { animation-delay: 0.6s; }
.cell:nth-child(13) { animation-delay: 0.65s; }
.cell:nth-child(14) { animation-delay: 0.7s; }
.cell:nth-child(15) { animation-delay: 0.75s; }
.cell:nth-child(16) { animation-delay: 0.8s; }
.c-purple { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.2); }
.c-blue { background: rgba(96,165,250,0.1); border-color: rgba(96,165,250,0.2); }
.c-pink { background: rgba(244,114,182,0.1); border-color: rgba(244,114,182,0.2); }
.c-green { background: rgba(52,211,153,0.1); border-color: rgba(52,211,153,0.2); }
.c-amber { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.2); }
.btn-row { text-align: center; margin-top: 24px; }
.btn { padding: 12px 28px; background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.3); border-radius: 12px; color: #a78bfa; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn:hover { background: rgba(167,139,250,0.25); }
</style>
</head>
<body>
<h1>Staggered Grid Animations</h1>
<p class="sub">Items appear one by one with incremental delays</p>
<div class="grid" id="grid">
  <div class="cell c-purple">🎨</div>
  <div class="cell c-blue">⚡</div>
  <div class="cell c-pink">🚀</div>
  <div class="cell c-green">💎</div>
  <div class="cell c-amber">✨</div>
  <div class="cell c-blue">🎯</div>
  <div class="cell c-purple">🔮</div>
  <div class="cell c-green">🌸</div>
  <div class="cell c-pink">💫</div>
  <div class="cell c-amber">🏆</div>
  <div class="cell c-blue">🌌</div>
  <div class="cell c-purple">🎭</div>
  <div class="cell c-green">🎪</div>
  <div class="cell c-pink">🌈</div>
  <div class="cell c-amber">⭐</div>
  <div class="cell c-blue">🎸</div>
</div>
<div class="btn-row">
  <button class="btn" onclick="replay()">Replay Animation</button>
</div>
<script>
function replay() {
  const cells = document.querySelectorAll('.cell');
  cells.forEach(c => { c.style.animation = 'none'; c.offsetHeight; c.style.animation = ''; });
}
</script>
</body>
</html>
