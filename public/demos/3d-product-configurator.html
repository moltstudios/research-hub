<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Product Configurator Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: linear-gradient(135deg, #0f0f1a, #1a1a2e); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { max-width: 640px; width: 100%; padding: 24px; }
.card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 48px; text-align: center; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 32px; }
.product-stage { width: 200px; height: 200px; margin: 0 auto 32px; perspective: 600px; }
.cube { width: 200px; height: 200px; position: relative; transform-style: preserve-3d; animation: rotate 8s infinite linear; }
.cube.face { position: absolute; width: 200px; height: 200px; border: 2px solid rgba(167,139,250,0.3); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
.cube .front { background: rgba(167,139,250,0.15); transform: translateZ(100px); }
.cube .back { background: rgba(96,165,250,0.15); transform: rotateY(180deg) translateZ(100px); }
.cube .right { background: rgba(244,114,182,0.15); transform: rotateY(90deg) translateZ(100px); }
.cube .left { background: rgba(52,211,153,0.15); transform: rotateY(-90deg) translateZ(100px); }
.cube .top { background: rgba(251,191,36,0.15); transform: rotateX(90deg) translateZ(100px); }
.cube .bottom { background: rgba(239,68,68,0.15); transform: rotateX(-90deg) translateZ(100px); }
@keyframes rotate { from { transform: rotateX(-20deg) rotateY(0deg); } to { transform: rotateX(-20deg) rotateY(360deg); } }
.colors { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
.color-btn { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: all 0.2s; }
.color-btn:hover, .color-btn.active { border-color: #fff; transform: scale(1.15); }
.color-btn.c1 { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
.color-btn.c2 { background: linear-gradient(135deg, #60a5fa, #2563eb); }
.color-btn.c3 { background: linear-gradient(135deg, #f472b6, #db2777); }
.color-btn.c4 { background: linear-gradient(135deg, #34d399, #059669); }
.price { font-size: 32px; font-weight: 700; margin: 16px 0 24px; }
.price span { font-size: 16px; color: rgba(255,255,255,0.5); }
.btn { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #a78bfa, #60a5fa); border: none; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(167,139,250,0.4); }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>3D Product Configurator</h1>
    <p>Interactive 3D preview with real-time color changes</p>
    <div class="product-stage">
      <div class="cube">
        <div class="face front">Front</div>
        <div class="face back">Back</div>
        <div class="face right">Right</div>
        <div class="face left">Left</div>
        <div class="face top">Top</div>
        <div class="face bottom">Bottom</div>
      </div>
    </div>
    <div class="colors">
      <div class="color-btn c1 active" onclick="setColor(this)"></div>
      <div class="color-btn c2" onclick="setColor(this)"></div>
      <div class="color-btn c3" onclick="setColor(this)"></div>
      <div class="color-btn c4" onclick="setColor(this)"></div>
    </div>
    <div class="price">$149 <span>/ unit</span></div>
    <button class="btn">Add to Cart</button>
  </div>
</div>
<script>
function setColor(el) {
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
