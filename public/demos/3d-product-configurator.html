<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Product Configurator Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .ui-overlay {
      position: relative;
      z-index: 10;
    }
    .control-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }
    .color-option {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 3px solid transparent;
    }
    .color-option:hover {
      transform: scale(1.1);
    }
    .color-option.selected {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }
    .price-tag {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 700;
    }
    @media (max-width: 768px) {
      .control-panel {
        position: absolute;
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        border-radius: 20px 20px 0 0;
        max-height: 50vh;
        overflow-y: auto;
      }
      .info-panel {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <div class="control-panel">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Product Configurator</h2>

      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-600 mb-3">Color Options</label>
        <div class="flex gap-3 flex-wrap" id="color-options">
          <div class="color-option selected" style="background: #1a1a2e;" data-color="#1a1a2e"></div>
          <div class="color-option" style="background: #e74c3c;" data-color="#e74c3c"></div>
          <div class="color-option" style="background: #3498db;" data-color="#3498db"></div>
          <div class="color-option" style="background: #2ecc71;" data-color="#2ecc71"></div>
          <div class="color-option" style="background: #f39c12;" data-color="#f39c12"></div>
          <div class="color-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-600 mb-3">Material Finish</label>
        <div class="flex gap-2" id="material-options">
          <button class="material-btn flex-1 py-2 px-4 rounded-lg border-2 border-blue-500 bg-blue-50 text-sm font-medium text-blue-700" data-material="matte">Matte</button>
          <button class="material-btn flex-1 py-2 px-4 rounded-lg border-2 border-gray-200 text-sm font-medium text-gray-600" data-material="glossy">Glossy</button>
          <button class="material-btn flex-1 py-2 px-4 rounded-lg border-2 border-gray-200 text-sm font-medium text-gray-600" data-material="metallic">Metallic</button>
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-600 mb-3">Configuration Details</label>
        <div class="space-y-2 text-sm text-gray-600">
          <div class="flex justify-between">
            <span>Base Model</span>
            <span class="font-medium">Drone Pro X</span>
          </div>
          <div class="flex justify-between">
            <span>Frame</span>
            <span class="font-medium">Carbon Fiber</span>
          </div>
          <div class="flex justify-between">
            <span>Components</span>
            <span class="font-medium">4 Rotors</span>
          </div>
        </div>
      </div>

      <div class="price-tag mb-4" id="price">$2,499</div>

      <button class="w-full py-3 px-6 bg-gray-900 text-white rounded-xl font-semibold hover:bg-gray-800 transition-colors shadow-lg">
        Add to Cart
      </button>
    </div>

    <div class="info-panel">
      <h3 class="font-bold text-gray-800 mb-2">Interactive 3D Configurator</h3>
      <p class="text-sm text-gray-600 mb-3">Drag to rotate • Scroll to zoom • Click options to customize</p>
      <div class="flex gap-4 text-xs text-gray-500">
        <span>🖱️ Drag</span>
        <span>🔍 Scroll</span>
        <span>⚡ Real-time</span>
      </div>
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(5, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI / 2;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 7);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);

    // Floor
    const floorGeometry = new THREE.PlaneGeometry(20, 20);
    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xf1f5f9,
      roughness: 0.8,
      metalness: 0.1
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Grid helper
    const gridHelper = new THREE.GridHelper(20, 20, 0xe2e8f0, 0xe2e8f0);
    scene.add(gridHelper);

    // Drone Model (simplified)
    const droneGroup = new THREE.Group();

    // Main body
    const bodyGeometry = new THREE.BoxGeometry(1.5, 0.3, 1);
    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0x1a1a2e,
      roughness: 0.3,
      metalness: 0.7
    });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.castShadow = true;
    droneGroup.add(body);

    // Top plate
    const topPlateGeometry = new THREE.BoxGeometry(1.3, 0.1, 0.8);
    const topPlate = new THREE.Mesh(topPlateGeometry, bodyMaterial);
    topPlate.position.y = 0.2;
    topPlate.castShadow = true;
    droneGroup.add(topPlate);

    // Arms
    const armGeometry = new THREE.CylinderGeometry(0.08, 0.08, 2.5);
    const armMaterial = new THREE.MeshStandardMaterial({
      color: 0x4a5568,
      roughness: 0.4,
      metalness: 0.8
    });

    const arm1 = new THREE.Mesh(armGeometry, armMaterial);
    arm1.rotation.z = Math.PI / 4;
    arm1.castShadow = true;
    droneGroup.add(arm1);

    const arm2 = new THREE.Mesh(armGeometry, armMaterial);
    arm2.rotation.z = -Math.PI / 4;
    arm2.castShadow = true;
    droneGroup.add(arm2);

    // Propellers
    const propellerGeometry = new THREE.BoxGeometry(0.6, 0.02, 0.6);
    const propellerMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.9
    });

    const propellers = [];
    const propPositions = [
      { x: 1.1, y: 0.15, z: 1.1 },
      { x: -1.1, y: 0.15, z: 1.1 },
      { x: 1.1, y: 0.15, z: -1.1 },
      { x: -1.1, y: 0.15, z: -1.1 }
    ];

    propPositions.forEach((pos, i) => {
      const propeller = new THREE.Mesh(propellerGeometry, propellerMaterial);
      propeller.position.set(pos.x, pos.y, pos.z);
      propeller.castShadow = true;
      droneGroup.add(propeller);
      propellers.push(propeller);
    });

    // Camera
    const cameraGeometry = new THREE.BoxGeometry(0.3, 0.15, 0.2);
    const cameraMaterial = new THREE.MeshStandardMaterial({
      color: 0x333333,
      roughness: 0.2,
      metalness: 0.9
    });
    const camera = new THREE.Mesh(cameraGeometry, cameraMaterial);
    camera.position.set(0, 0.25, 0.7);
    camera.castShadow = true;
    droneGroup.add(camera);

    // LED indicators
    const ledGeometry = new THREE.SphereGeometry(0.04);
    const ledMaterial = new THREE.MeshStandardMaterial({
      color: 0x00ff00,
      emissive: 0x00ff00,
      emissiveIntensity: 0.5
    });

    const led1 = new THREE.Mesh(ledGeometry, ledMaterial);
    led1.position.set(-0.4, 0.25, 0.5);
    droneGroup.add(led1);

    const led2 = new THREE.Mesh(ledGeometry, ledMaterial);
    led2.position.set(0.4, 0.25, 0.5);
    droneGroup.add(led2);

    scene.add(droneGroup);

    // Animation loop
    let propellerSpeed = 0.2;
    function animate() {
      requestAnimationFrame(animate);

      // Rotate propellers
      propellers.forEach((propeller, i) => {
        propeller.rotation.y += propellerSpeed;
      });

      // Gentle floating animation
      const time = Date.now() * 0.001;
      droneGroup.position.y = Math.sin(time) * 0.05;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Color selection
    const colorOptions = document.querySelectorAll('.color-option');
    let currentColor = '#1a1a2e';

    colorOptions.forEach(option => {
      option.addEventListener('click', () => {
        colorOptions.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        currentColor = option.dataset.color;

        bodyMaterial.color.set(currentColor);
        topPlateMaterial.color.set(currentColor);
        cameraMaterial.color.set(currentColor);
      });
    });

    // Material selection
    const materialButtons = document.querySelectorAll('.material-btn');
    let currentMaterial = 'matte';

    materialButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        materialButtons.forEach(b => {
          b.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
          b.classList.add('border-gray-200', 'text-gray-600');
        });
        btn.classList.remove('border-gray-200', 'text-gray-600');
        btn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
        currentMaterial = btn.dataset.material;

        const roughness = currentMaterial === 'matte' ? 0.5 : currentMaterial === 'glossy' ? 0.1 : 0.3;
        const metalness = currentMaterial === 'metallic' ? 0.9 : currentMaterial === 'glossy' ? 0.3 : 0.7;

        bodyMaterial.roughness = roughness;
        bodyMaterial.metalness = metalness;
        cameraMaterial.roughness = roughness;
        cameraMaterial.metalness = metalness;
        armMaterial.roughness = 0.4;
        armMaterial.metalness = 0.8;
      });
    });

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Price update
    function updatePrice() {
      const basePrice = 2499;
      let multiplier = 1;

      if (currentColor === '#e74c3c' || currentColor === '#3498db' || currentColor === '#9b59b6') {
        multiplier += 0.1; // Premium colors
      }

      if (currentMaterial === 'glossy') {
        multiplier += 0.05;
      } else if (currentMaterial === 'metallic') {
        multiplier += 0.15;
      }

      const price = Math.round(basePrice * multiplier);
      document.getElementById('price').textContent = `$${price.toLocaleString()}`;
    }

    colorOptions.forEach(opt => opt.addEventListener('click', updatePrice));
    materialButtons.forEach(btn => btn.addEventListener('click', updatePrice));
  </script>
</body>
</html>
