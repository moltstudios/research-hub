<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Product Viewer Demo — Jin's Research</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }
        #canvas-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        canvas {
            display: block;
            outline: none;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
        }
        .color-picker {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }
        .view-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .view-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .view-btn.active {
            background: #fff;
            color: #000;
        }
        .info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            max-width: 280px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .info-panel h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .info-panel p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div id="canvas-container"></div>

    <div class="info-panel">
        <h2>3D Product Viewer</h2>
        <p>Interactive product showcase using Three.js. Drag to rotate, scroll to zoom. Change colors, switch views, or reset to defaults.</p>
    </div>

    <div class="stats" id="stats">
        <div>FPS: <span id="fps">0</span></div>
        <div>Objects: 1</div>
        <div>Draw Calls: 1</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Color</label>
            <input type="color" id="colorPicker" value="#3b82f6" class="color-picker">
        </div>
        <div class="control-group">
            <label>View</label>
            <div style="display: flex; gap: 8px;">
                <button class="view-btn active" data-view="front">Front</button>
                <button class="view-btn" data-view="side">Side</button>
                <button class="view-btn" data-view="top">Top</button>
            </div>
        </div>
        <div class="control-group">
            <label>Actions</label>
            <div style="display: flex; gap: 8px;">
                <button class="view-btn" id="autoRotate">Auto Rotate</button>
                <button class="view-btn" id="reset">Reset</button>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(5, 3, 5);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 15;
        controls.enablePan = false;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.bias = -0.0001;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x88ccff, 0.3);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffaa55, 0.4);
        rimLight.position.set(0, -5, 5);
        scene.add(rimLight);

        // Product (simplified drone shape)
        const productGroup = new THREE.Group();

        // Main body
        const bodyGeometry = new THREE.BoxGeometry(1.5, 0.3, 1);
        const bodyMaterial = new THREE.MeshStandardMaterial({
            color: 0x3b82f6,
            metalness: 0.6,
            roughness: 0.4
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.castShadow = true;
        body.receiveShadow = true;
        productGroup.add(body);

        // Camera
        const cameraGeometry = new THREE.BoxGeometry(0.6, 0.15, 0.15);
        const cameraMesh = new THREE.Mesh(cameraGeometry, bodyMaterial);
        cameraMesh.position.set(0, 0.2, 0.51);
        cameraMesh.castShadow = true;
        productGroup.add(cameraMesh);

        // Arms
        const armGeometry = new THREE.CylinderGeometry(0.08, 0.08, 2.5, 16);
        const armMaterial = new THREE.MeshStandardMaterial({
            color: 0x666666,
            metalness: 0.7,
            roughness: 0.3
        });

        const frontArm = new THREE.Mesh(armGeometry, armMaterial);
        frontArm.rotation.z = Math.PI / 2;
        frontArm.position.set(0, 0, 0.8);
        frontArm.castShadow = true;
        productGroup.add(frontArm);

        const backArm = new THREE.Mesh(armGeometry, armMaterial);
        backArm.rotation.z = Math.PI / 2;
        backArm.position.set(0, 0, -0.8);
        backArm.castShadow = true;
        productGroup.add(backArm);

        // Propellers
        const propGeometry = new THREE.BoxGeometry(0.08, 0.5, 0.5);
        const propMaterial = new THREE.MeshStandardMaterial({
            color: 0x222222,
            metalness: 0.5,
            roughness: 0.5
        });

        const propellers = [];
        const positions = [
            [0.8, 0, 0.8], [-0.8, 0, 0.8],
            [0.8, 0, -0.8], [-0.8, 0, -0.8]
        ];

        positions.forEach((pos, i) => {
            const prop = new THREE.Mesh(propGeometry, propMaterial);
            prop.position.set(...pos);
            prop.castShadow = true;
            productGroup.add(prop);
            propellers.push(prop);
        });

        // LED lights
        const ledGeometry = new THREE.SphereGeometry(0.03, 16, 16);
        const ledMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

        positions.forEach(pos => {
            const led = new THREE.Mesh(ledGeometry, ledMaterial);
            led.position.set(...pos);
            productGroup.add(led);
        });

        scene.add(productGroup);

        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.8,
            roughness: 0.5
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(20, 20, 0x333333, 0x222222);
        gridHelper.position.y = -0.19;
        scene.add(gridHelper);

        // Animation state
        let autoRotate = false;
        let currentView = 'front';

        // Event listeners
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            const color = e.target.value;
            bodyMaterial.color.set(color);
            cameraMesh.material.color.set(color);
        });

        document.querySelectorAll('.view-btn[data-view]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.view-btn[data-view]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.dataset.view;
                animateToView(currentView);
            });
        });

        document.getElementById('autoRotate').addEventListener('click', (e) => {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 2;
            e.target.classList.toggle('active', autoRotate);
        });

        document.getElementById('reset').addEventListener('click', () => {
            camera.position.set(5, 3, 5);
            controls.target.set(0, 0, 0);
            controls.update();
            bodyMaterial.color.set('#3b82f6');
            document.getElementById('colorPicker').value = '#3b82f6';
            currentView = 'front';
            document.querySelectorAll('.view-btn[data-view]').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-view="front"]').classList.add('active');
        });

        // View animations
        function animateToView(view) {
            const targetPosition = { x: 0, y: 0, z: 0 };
            const targetLookAt = { x: 0, y: 0, z: 0 };

            switch(view) {
                case 'front':
                    targetPosition = { x: 0, y: 0, z: 6 };
                    break;
                case 'side':
                    targetPosition = { x: 6, y: 0, z: 0 };
                    break;
                case 'top':
                    targetPosition = { x: 0, y: 6, z: 0.1 };
                    break;
            }

            // Simple animation (could use GSAP for smoother results)
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(targetPosition.x, targetPosition.y, targetPosition.z);
            const startTime = Date.now();
            const duration = 500;

            function animateCamera() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeOutCubic(progress);

                camera.position.lerpVectors(startPos, endPos, eased);
                controls.target.set(0, 0, 0);

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }

            animateCamera();
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // FPS counter
        let frameCount = 0;
        let lastTime = performance.now();

        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        // Render loop
        function animate() {
            requestAnimationFrame(animate);

            // Animate propellers
            propellers.forEach((prop, i) => {
                prop.rotation.y += 0.3 * (i % 2 === 0 ? 1 : -1);
            });

            controls.update();
            renderer.render(scene, camera);
            updateFPS();
        }

        // Hide loading screen when scene is ready
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        });

        animate();
    </script>
</body>
</html>
