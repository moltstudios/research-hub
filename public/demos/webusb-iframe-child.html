<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebUSB iframe probe child</title>
  <style>body{font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;margin:8px;color:#1c1917}</style>
</head>
<body>
  <div id="out">probing…</div>
  <script>
    (function(){
      var d = {
        kind: 'webusb-probe',
        hasUsb: typeof navigator.usb,
        secure: window.isSecureContext,
        protocol: location.protocol,
        href: location.href,
        hasGetDevices: typeof (navigator.usb && navigator.usb.getDevices),
        hasRequestDevice: typeof (navigator.usb && navigator.usb.requestDevice),
      };
      document.getElementById('out').textContent = 'hasUsb:'+d.hasUsb+' secure:'+d.secure+' protocol:'+d.protocol;
      try { parent.postMessage(d, '*'); } catch (e) { document.getElementById('out').textContent += ' | postMessage failed: '+e.message; }
    })();
  </script>
</body>
</html>
