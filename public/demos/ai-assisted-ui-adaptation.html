<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Assisted UI Adaptation Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
    }
    .adaptive-card {
      transition: all 0.5s ease;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Simulated AI Recommendation Engine
    const useAIRecommendation = (userBehavior) => {
      const [recommendations, setRecommendations] = useState([]);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        setLoading(true);
        // Simulate AI prediction delay
        setTimeout(() => {
          const products = [
            { id: 1, name: "Arc Battery Pack Pro", price: "$299", category: "drone-accessories", reason: "Based on your interest in drone accessories" },
            { id: 2, name: "Flight Controller X2", price: "$189", category: "drone-parts", reason: "Popular among users who viewed controllers" },
            { id: 3, name: "4K Camera Gimbal", price: "$349", category: "camera-gear", reason: "Highly recommended for aerial photography" },
            { id: 4, name: "Emergency Battery Pack", price: "$79", category: "drone-accessories", reason: "Essential backup for your drone" },
            { id: 5, name: "Propeller Set (4-pack)", price: "$49", category: "drone-parts", reason: "Common replacement item" },
          ];

          // Simple AI logic: prioritize based on behavior
          const sorted = products.sort((a, b) => {
            const aScore = userBehavior.viewedItems.includes(a.id) ? 2 : 1;
            const bScore = userBehavior.viewedItems.includes(b.id) ? 2 : 1;
            return bScore - aScore;
          });

          setRecommendations(sorted.slice(0, 3));
          setLoading(false);
        }, 800);
      }, [userBehavior.viewedItems]);

      return { recommendations, loading };
    };

    // Context-Aware Layout Component
    const ContextAwareLayout = ({ children, isMobile }) => {
      return (
        <div className={`min-h-screen transition-all duration-500 ${isMobile ? 'p-4' : 'p-8'}`}>
          <div className={`max-w-7xl mx-auto ${isMobile ? 'grid gap-4' : 'grid grid-cols-12 gap-6'}`}>
            {children}
          </div>
        </div>
      );
    };

    // Adaptive Dashboard Widget
    const AdaptiveWidget = ({ widget, priority, onClick }) => {
      return (
        <div
          className={`adaptive-card bg-gray-800 rounded-xl p-6 cursor-pointer hover:bg-gray-700 ${
            priority === 'high' ? 'border-l-4 border-green-500' : priority === 'medium' ? 'border-l-4 border-yellow-500' : 'border-l-4 border-blue-500'
          }`}
          onClick={onClick}
        >
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-lg font-semibold">{widget.title}</h3>
            <span className={`text-xs px-2 py-1 rounded ${
              priority === 'high' ? 'bg-green-500/20 text-green-400' :
              priority === 'medium' ? 'bg-yellow-500/20 text-yellow-400' :
              'bg-blue-500/20 text-blue-400'
            }`}>
              {priority}
            </span>
          </div>
          <p className="text-gray-400 text-sm">{widget.description}</p>
          <div className="mt-4 flex items-center text-green-400 text-sm">
            <span>AI-Prioritized</span>
            <svg className="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </div>
        </div>
      );
    };

    // Smart Recommendation Card
    const SmartRecommendation = ({ product, onClick }) => {
      return (
        <div className="adaptive-card bg-gradient-to-br from-purple-900 to-gray-800 rounded-xl p-6 cursor-pointer hover:from-purple-800 hover:to-gray-700">
          <div className="flex items-start justify-between">
            <div className="flex-1">
              <div className="flex items-center gap-2 mb-2">
                <span className="text-xs px-2 py-1 bg-purple-500/30 text-purple-300 rounded-full">AI Recommended</span>
              </div>
              <h3 className="text-xl font-bold mb-1">{product.name}</h3>
              <p className="text-2xl font-bold text-purple-400 mb-3">{product.price}</p>
              <p className="text-gray-400 text-sm mb-4">{product.reason}</p>
              <button className="w-full py-2 bg-purple-600 hover:bg-purple-500 rounded-lg transition-colors">
                View Details
              </button>
            </div>
            <div className="w-24 h-24 bg-gray-700 rounded-lg flex items-center justify-center">
              <span className="text-4xl">🚁</span>
            </div>
          </div>
        </div>
      );
    };

    // Main App
    const App = () => {
      const [userBehavior, setUserBehavior] = useState({ clicks: 0, viewedItems: [] });
      const [viewportWidth, setViewportWidth] = useState(window.innerWidth);
      const [showRecommendations, setShowRecommendations] = useState(false);

      // Context-aware detection
      const isMobile = useMemo(() => viewportWidth < 768, [viewportWidth]);

      // Track user behavior
      const handleItemClick = (itemId) => {
        setUserBehavior(prev => ({
          clicks: prev.clicks + 1,
          viewedItems: [...new Set([...prev.viewedItems, itemId])]
        }));
      };

      // AI recommendations hook
      const { recommendations, loading } = useAIRecommendation(userBehavior);

      // Dashboard widgets (simulating AI prioritization)
      const widgets = useMemo(() => [
        { id: 1, title: 'Flight Analytics', description: 'Real-time telemetry and performance metrics', priority: userBehavior.clicks > 3 ? 'high' : 'medium' },
        { id: 2, title: 'Battery Status', description: 'Current charge levels across all devices', priority: 'medium' },
        { id: 3, title: 'Recent Activity', description: 'Latest flight logs and maintenance records', priority: userBehavior.clicks > 5 ? 'high' : 'low' },
        { id: 4, title: 'Weather Conditions', description: 'Local weather for safe flying conditions', priority: 'medium' },
        { id: 5, title: 'Community Updates', description: 'Latest drone news and firmware updates', priority: 'low' },
      ], [userBehavior.clicks]);

      return (
        <ContextAwareLayout isMobile={isMobile}>
          <div className="mb-8">
            <h1 className="text-4xl font-bold mb-2">AI-Assisted UI Adaptation</h1>
            <p className="text-gray-400">
              Interact with the page to see how AI adapts the interface in real-time
            </p>
          </div>

          {/* User Behavior Stats */}
          <div className="bg-gray-800 rounded-xl p-6 mb-8">
            <h2 className="text-xl font-semibold mb-4">User Behavior Tracking</h2>
            <div className="grid grid-cols-3 gap-4">
              <div className="text-center">
                <div className="text-3xl font-bold text-blue-400">{userBehavior.clicks}</div>
                <div className="text-gray-400 text-sm">Total Clicks</div>
              </div>
              <div className="text-center">
                <div className="text-3xl font-bold text-purple-400">{userBehavior.viewedItems.length}</div>
                <div className="text-gray-400 text-sm">Items Viewed</div>
              </div>
              <div className="text-center">
                <div className="text-3xl font-bold text-green-400">
                  {userBehavior.clicks > 3 ? 'High' : userBehavior.clicks > 0 ? 'Medium' : 'Low'}
                </div>
                <div className="text-gray-400 text-sm">Adaptation Level</div>
              </div>
            </div>
          </div>

          {/* Adaptive Dashboard */}
          <div className="mb-8">
            <h2 className="text-2xl font-bold mb-4">Adaptive Dashboard</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {widgets.map(widget => (
                <AdaptiveWidget
                  key={widget.id}
                  widget={widget}
                  priority={widget.priority}
                  onClick={() => handleItemClick(widget.id)}
                />
              ))}
            </div>
          </div>

          {/* Smart Recommendations */}
          <div className="mb-8">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-2xl font-bold">Smart Recommendations</h2>
              <button
                onClick={() => setShowRecommendations(!showRecommendations)}
                className="px-4 py-2 bg-purple-600 hover:bg-purple-500 rounded-lg transition-colors"
              >
                {showRecommendations ? 'Hide Recommendations' : 'Show AI Recommendations'}
              </button>
            </div>

            {showRecommendations && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {loading ? (
                  <div className="col-span-full py-12 text-center">
                    <div className="w-16 h-16 border-4 border-purple-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p className="text-gray-400">AI is analyzing your preferences...</p>
                  </div>
                ) : (
                  recommendations.map(product => (
                    <SmartRecommendation
                      key={product.id}
                      product={product}
                      onClick={() => handleItemClick(product.id)}
                    />
                  ))
                )}
              </div>
            )}
          </div>

          {/* Context Awareness Display */}
          <div className="bg-gradient-to-r from-blue-900 to-purple-900 rounded-xl p-6">
            <h2 className="text-2xl font-bold mb-4">Context Awareness</h2>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <div className="bg-gray-800 rounded-lg p-4">
                <div className="text-sm text-gray-400 mb-1">Device Type</div>
                <div className="text-lg font-semibold">
                  {isMobile ? '📱 Mobile' : '💻 Desktop'}
                </div>
              </div>
              <div className="bg-gray-800 rounded-lg p-4">
                <div className="text-sm text-gray-400 mb-1">Viewport</div>
                <div className="text-lg font-semibold">
                  {viewportWidth}px
                </div>
              </div>
              <div className="bg-gray-800 rounded-lg p-4">
                <div className="text-sm text-gray-400 mb-1">Layout Mode</div>
                <div className="text-lg font-semibold">
                  {isMobile ? 'Compact' : 'Full'}
                </div>
              </div>
              <div className="bg-gray-800 rounded-lg p-4">
                <div className="text-sm text-gray-400 mb-1">AI Adaptation</div>
                <div className="text-lg font-semibold text-green-400">
                  Active
                </div>
              </div>
            </div>
          </div>

          {/* Footer */}
          <div className="mt-12 text-center text-gray-500 text-sm">
            <p>Click on widgets and recommendations to see AI adapt in real-time</p>
            <p className="mt-2">Try resizing your browser to see context-aware layout changes</p>
          </div>
        </ContextAwareLayout>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
