<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔬 Molt Studios Research Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e5e5e5;font-family:-apple-system,sans-serif;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:2rem}
.header{border-bottom:1px solid #262626;padding-bottom:1.5rem;margin-bottom:2rem}
.header h1{font-size:1.75rem;font-weight:700;color:#fff}
.header p{color:#737373;font-size:0.875rem;margin-top:0.5rem}
.filters{display:flex;gap:1.5rem;margin-bottom:2rem;flex-wrap:wrap}
.filter-group{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center}
.filter-label{font-size:0.75rem;color:#737373;text-transform:uppercase}
.btn{padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.75rem;border:none;cursor:pointer;background:#262626;color:#a3a3a3}
.btn.active{background:#6366f1;color:#fff}
.agent-section{margin-bottom:2rem}
.agent-header{font-size:1.125rem;font-weight:600;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem}
.entry{background:#171717;border-radius:0.5rem;padding:1rem;border:1px solid #262626;margin-bottom:0.5rem}
.entry-title{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem;flex-wrap:wrap;cursor:pointer}
.priority{font-size:0.625rem;font-family:monospace;font-weight:700}
.priority.high{color:#f87171}.priority.med{color:#fbbf24}.priority.low{color:#4ade80}
.name{font-weight:600;color:#e5e5e5}
.cat{font-size:0.625rem;background:#262626;padding:0.125rem 0.5rem;border-radius:9999px;color:#a3a3a3}
.expand-btn{font-size:0.625rem;background:none;border:1px solid #404040;color:#737373;padding:0.125rem 0.5rem;border-radius:4px;cursor:pointer;margin-left:auto}
.expand-btn:hover{color:#a3a3a3;border-color:#525252}
.desc{font-size:0.8125rem;color:#737373;margin-top:0.25rem}
.desc-full{font-size:0.8125rem;color:#a3a3a3;margin-top:0.5rem;padding:0.75rem;background:#1a1a2e;border-radius:0.375rem;border:1px solid #262626;display:none;line-height:1.6;white-space:pre-wrap}
.desc-full.open{display:block}
.tags{display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;align-items:center}
.tag{font-size:0.625rem;background:#1e1b4b;color:#a5b4fc;padding:0.125rem 0.5rem;border-radius:9999px}
.link{font-size:0.75rem;color:#818cf8;text-decoration:none}
.empty{text-align:center;padding:4rem;color:#525252}
.empty-icon{font-size:3rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔬 Molt Studios Research Hub</h1>
    <p>Agent research & live demos — organized by priority</p>
  </div>
  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Agent:</span>
      <div id="agent-filters" style="display:flex;gap:0.5rem;flex-wrap:wrap"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Category:</span>
      <div id="cat-filters" style="display:flex;gap:0.5rem;flex-wrap:wrap"></div>
    </div>
  </div>
  <div id="content"></div>
</div>
<script>
const API='https://mission-control-api-gamma.vercel.app/api/research';
const EMOJI={ghost:'👻',maya:'🧘‍♀️',dex:'🔍',raven:'📧',jin:'🎨',neo:'⚙️',aria:'🎯',sage:'🧠',cash:'💰'};
const COLORS={ghost:'#6366f1',maya:'#a855f7',dex:'#f59e0b',raven:'#ef4444',jin:'#ec4899',neo:'#3b82f6',aria:'#10b981',sage:'#8b5cf6',cash:'#f97316'};
let filterAgent='all',filterCat='all',research=[];
async function load(){research=await fetch(API).then(r=>r.json()).catch(()=>[]);render()}
function render(){
  var agents=[...new Set(research.map(r=>r.agent))].sort();
  var cats=[...new Set(research.map(r=>r.category))].sort();
  var af=document.getElementById('agent-filters');
  af.innerHTML='<button class="btn '+(filterAgent==='all'?'active':'')+'" onclick="setFilter(\'agent\',\'all\')">All</button>'+agents.map(a=>'<button class="btn '+(filterAgent===a?'active':'')+'" style="'+(filterAgent===a?'background:'+(COLORS[a]||'#6366f1'):'')+'" onclick="setFilter(\'agent\',\''+a+'\')">'+(EMOJI[a]||'🤖')+' '+a+'</button>').join('');
  var cf=document.getElementById('cat-filters');
  cf.innerHTML='<button class="btn '+(filterCat==='all'?'active':'')+'" onclick="setFilter(\'cat\',\'all\')">All</button>'+cats.map(c=>'<button class="btn '+(filterCat===c?'active':'')+'" onclick="setFilter(\'cat\',\''+c+'\')">'+c+'</button>').join('');
  var filtered=research;
  if(filterAgent!=='all')filtered=filtered.filter(r=>r.agent===filterAgent);
  if(filterCat!=='all')filtered=filtered.filter(r=>r.category===filterCat);
  filtered.sort((a,b)=>a.priority-b.priority);
  var grouped={};
  filtered.forEach(r=>{if(!grouped[r.agent])grouped[r.agent]=[];grouped[r.agent].push(r)});
  var html='';
  if(Object.keys(grouped).length===0){
    html='<div class="empty"><div class="empty-icon">🔬</div><p>No research entries yet.</p><p style="font-size:0.875rem;margin-top:0.5rem">Jin and Sage will populate this with their daily research.</p></div>';
  } else {
    Object.keys(grouped).sort().forEach(agent=>{
      html+='<div class="agent-section">';
      html+='<div class="agent-header" style="color:'+(COLORS[agent]||'#fff')+'">'+(EMOJI[agent]||'🤖')+' '+agent.toUpperCase()+' <span style="font-size:0.75rem;color:#525252;font-weight:400">('+grouped[agent].length+' entries)</span></div>';
      grouped[agent].forEach(r=>{
        var pc=r.priority<=3?'high':r.priority<=6?'med':'low';
        var pl=r.priority<=3?'HIGH':r.priority<=6?'MED':'LOW';
        html+='<div class="entry" id="entry-'+r.id+'"><div class="entry-title" onclick="toggleDesc(\''+r.id+'\')"><span class="priority '+pc+'">['+pl+' '+r.priority+']</span><span class="name">'+r.title+'</span><span class="cat">'+r.category+'</span>';
        if(r.description && r.description.length > 150) html+='<span class="expand-btn" id="btn-'+r.id+'">▼ Read more</span>';
        html+='</div>';
        if(r.description){
          if(r.description.length > 150){
            html+='<div class="desc">'+r.description.substring(0,150)+'...</div>';
            html+='<div class="desc-full" id="desc-'+r.id+'">'+r.description+'</div>';
          } else {
            html+='<div class="desc">'+r.description+'</div>';
          }
        }
        var extras=[];
        if(r.example_url)extras.push('<a class="link" href="'+r.example_url+'" target="_blank">🔗 View Demo</a>');
        if(r.tags&&r.tags.length)extras.push(r.tags.map(t=>'<span class="tag">'+t+'</span>').join(''));
        if(extras.length)html+='<div class="tags">'+extras.join(' ')+'</div>';
        html+='</div>';
      });
      html+='</div>';
    });
  }
  document.getElementById('content').innerHTML=html;
}
function setFilter(type,val){if(type==='agent')filterAgent=val;else filterCat=val;render()}
function toggleDesc(id){
  var el=document.getElementById('desc-'+id);
  var btn=document.getElementById('btn-'+id);
  if(el){el.classList.toggle('open');if(btn)btn.textContent=el.classList.contains('open')?'▲ Collapse':'▼ Read more';}
}
load();
</script>
</body>
</html>
