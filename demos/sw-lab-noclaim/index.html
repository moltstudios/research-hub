<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sw-lab noclaim probe page</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%234f46e5'/></svg>">
<style>
  body { font: 13px/1.5 ui-monospace, monospace; margin: 12px; color: #1e293b; background: #fff; }
  code { color: #4f46e5; }
</style>
</head>
<body>
  <p><strong>noclaim probe page</strong> — lives inside the <code>/demos/sw-lab-noclaim/</code> scope.</p>
  <p id="ctl">controller: (checking…)</p>
  <script>
    window.__isNoclaimProbe = true;
    function paint() {
      var c = navigator.serviceWorker && navigator.serviceWorker.controller;
      document.getElementById('ctl').textContent =
        'controller: ' + (c ? c.scriptURL.split('/').pop() + ' (CONTROLLED)' : 'null (NOT controlled)');
      window.__probeController = c ? c.scriptURL : null;
    }
    paint();
    navigator.serviceWorker && navigator.serviceWorker.addEventListener('controllerchange', paint);
  </script>
</body>
</html>
