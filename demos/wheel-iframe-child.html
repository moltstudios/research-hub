<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>wheel child</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; font: 13px/1.5 ui-monospace, monospace; }
  #zone { height: 400px; background: linear-gradient(#f7f1e4, #eadfc6); display: flex; align-items: center; justify-content: center; color: #7a5b00; font-weight: 600; }
</style>
</head>
<body>
<div id="zone">cross-origin child — wheel over me</div>
<script>
'use strict';
let wheels = 0, lastDy = null;
addEventListener('wheel', e => { wheels++; lastDy = e.deltaY; report(); }, { capture: true, passive: true });
function report() { try { parent.postMessage({ wchild: { wheels, lastDy } }, '*'); } catch (x) { } }
setInterval(report, 800);
report();
</script>
</body>
</html>
