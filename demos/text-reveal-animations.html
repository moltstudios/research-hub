<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Reveal Animations Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; padding: 40px 24px; overflow-x: hidden; }
h1 { text-align: center; font-size: 24px; font-weight: 600; margin-bottom: 40px; color: rgba(255,255,255,0.4); }
.demos { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }
.demo-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.3); margin-bottom: 16px; }
/* Clip reveal */
.clip-text { font-size: 42px; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; clip-path: inset(0 100% 0 0); animation: clipReveal 1.5s ease forwards; }
@keyframes clipReveal { to { clip-path: inset(0 0 0 0); } }
/* Fade up words */
.fade-words { font-size: 28px; font-weight: 700; line-height: 1.4; }
.fade-words span { display: inline-block; opacity: 0; transform: translateY(20px); animation: fadeUp 0.6s ease forwards; }
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
/* Typewriter */
.typewriter { font-size: 24px; font-weight: 600; border-right: 2px solid #a78bfa; white-space: nowrap; overflow: hidden; width: 0; animation: type 2s steps(24) forwards, blink 0.7s step-end infinite; }
@keyframes type { to { width: 100%; } }
@keyframes blink { 50% { border-color: transparent; } }
/* Scale up letters */
.scale-letters { font-size: 32px; font-weight: 800; }
.scale-letters span { display: inline-block; opacity: 0; transform: scale(0.5); animation: scaleUp 0.5s ease forwards; }
@keyframes scaleUp { to { opacity: 1; transform: scale(1); } }
/* Blur reveal */
.blur-text { font-size: 32px; font-weight: 700; filter: blur(12px); opacity: 0; animation: blurReveal 1.5s ease forwards; }
@keyframes blurReveal { to { filter: blur(0); opacity: 1; } }
</style>
</head>
<body>
<h1>Text Reveal Animations</h1>
<div class="demos">
  <div class="demo-section">
    <h3>Clip Reveal</h3>
    <div class="clip-text">Reveal from left to right</div>
  </div>
  <div class="demo-section">
    <h3>Fade Up Words</h3>
    <div class="fade-words" id="fadeWords"></div>
  </div>
  <div class="demo-section">
    <h3>Typewriter</h3>
    <div class="typewriter">Building the future with AI.</div>
  </div>
  <div class="demo-section">
    <h3>Scale Up Letters</h3>
    <div class="scale-letters" id="scaleLetters"></div>
  </div>
  <div class="demo-section">
    <h3>Blur Reveal</h3>
    <div class="blur-text">Focus into clarity</div>
  </div>
</div>
<script>
const words = 'Every word fades in one by one'.split(' ');
const fadeContainer = document.getElementById('fadeWords');
words.forEach((w, i) => {
  const span = document.createElement('span');
  span.textContent = w + ' ';
  span.style.animationDelay = (0.8 + i * 0.12) + 's';
  fadeContainer.appendChild(span);
});
const letters = 'SCALED UP'.split('');
const letterContainer = document.getElementById('scaleLetters');
letters.forEach((l, i) => {
  const span = document.createElement('span');
  span.textContent = l;
  span.style.animationDelay = (2.5 + i * 0.06) + 's';
  letterContainer.appendChild(span);
});
</script>
</body>
</html>
