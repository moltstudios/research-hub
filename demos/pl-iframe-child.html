<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pointer-lock tier — iframe child</title>
<link rel="icon" href="data:,">
<style>
  :root{ --ok:#1c6b47; --fail:#a32b1c; --info:#2a5a8a; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,system-ui,sans-serif;background:#fff;padding:14px}
  .lane{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#6d675f;margin-bottom:8px}
  button{font:600 13px/1 inherit;padding:9px 14px;border-radius:9px;border:1px solid #0e6b5c;background:#0e6b5c;color:#fff;cursor:pointer}
  .out{font:12px/1.55 var(--mono);margin-top:10px;min-height:34px;white-space:pre-wrap;background:#f6f4f1;border-radius:8px;padding:8px 10px}
  .ok{color:var(--ok)} .fail{color:var(--fail)}
</style>
</head>
<body>
<div class="lane" id="lane">child</div>
<button id="try">TRY LOCK (this document)</button>
<div class="out" id="out">— not run —</div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search).get('lane') || '?';
  document.getElementById('lane').textContent = 'child · lane: ' + q + ' · origin ' + location.origin;
  var out = document.getElementById('out');
  document.addEventListener('pointerlockchange', function () {
    var el = document.pointerLockElement;
    out.innerHTML = el
      ? '<span class="ok">LOCKED — pointerLockElement = ' + (el.id || el.nodeName) + '</span>'
      : '<span class="ok">unlocked (pointerlockchange fired)</span>';
    if (el) setTimeout(function () { document.exitPointerLock(); }, 1200);
  });
  document.addEventListener('pointerlockerror', function () {
    out.innerHTML = '<span class="fail">pointerlockerror — BLOCKED in this frame</span>';
  });
  document.getElementById('try').addEventListener('click', function () {
    var r;
    try { r = document.body.requestPointerLock(); } catch (e) { out.innerHTML = '<span class="fail">THREW ' + e + '</span>'; return; }
    var ret = (r === undefined) ? 'undefined (callback era)' : 'promise';
    out.textContent = 'requested (ret=' + ret + ')…';
    if (r && typeof r.then === 'function') {
      r.then(function () {}, function (e) {
        out.innerHTML = '<span class="fail">rejected ' + (e && e.name) + ': ' + (e && e.message || '') + '</span>';
      });
    }
  });
  window.__childReady = true;
})();
</script>
</body>
</html>
