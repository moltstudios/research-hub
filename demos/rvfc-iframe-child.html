<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>rVFC iframe child probe</title>
</head>
<body>
<p style="font:12px monospace;color:#6b7280">rvfc-iframe-child (presence battery)</p>
<script>
'use strict';
(function () {
  var reported = false;
  window.addEventListener('message', function (ev) {
    if (!ev.data || !ev.data.rvfcChild || reported) return;
    reported = true;
    var v = document.createElement('video');
    var res = {
      present: typeof v.requestVideoFrameCallback,
      cancel: typeof v.cancelVideoFrameCallback,
      proto: typeof HTMLVideoElement.prototype.requestVideoFrameCallback,
      secure: window.isSecureContext
    };
    try { ev.source.postMessage({ rvfcChild: ev.data.rvfcChild, res: res }, '*'); } catch (e) {}
  });
})();
</script>
</body>
</html>
