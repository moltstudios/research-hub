<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursor Follow Effects Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; overflow: hidden; cursor: none; }
.cursor { position: fixed; width: 24px; height: 24px; border-radius: 50%; background: rgba(167,139,250,0.8); pointer-events: none; z-index: 999; mix-blend-mode: screen; transition: width 0.3s, height 0.3s; transform: translate(-50%, -50%); }
.cursor-trail { position: fixed; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(167,139,250,0.3); pointer-events: none; z-index: 998; transform: translate(-50%, -50%); transition: all 0.15s ease-out; }
.glow { position: fixed; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(167,139,250,0.08), transparent 70%); pointer-events: none; z-index: 1; transform: translate(-50%, -50%); }
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(167,139,250,0.6); pointer-events: none; }
.content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
h1 { font-size: 36px; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { font-size: 15px; color: rgba(255,255,255,0.5); max-width: 400px; line-height: 1.6; }
.hint { margin-top: 40px; font-size: 12px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-trail" id="trail"></div>
<div class="glow" id="glow"></div>
<div class="particles" id="particles"></div>
<div class="content">
  <h1>Cursor Follow Effects</h1>
  <p>Move your mouse to see custom cursor, trailing glow, and particle effects that follow your movement.</p>
  <div class="hint">Move your cursor around</div>
</div>
<script>
const cursor = document.getElementById('cursor');
const trail = document.getElementById('trail');
const glow = document.getElementById('glow');
const particles = document.getElementById('particles');
let lastX = 0, lastY = 0;
document.addEventListener('mousemove', (e) => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  setTimeout(() => {
    trail.style.left = e.clientX + 'px';
    trail.style.top = e.clientY + 'px';
  }, 80);
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 8) {
    spawnParticle(e.clientX, e.clientY);
    lastX = e.clientX;
    lastY = e.clientY;
  }
});
function spawnParticle(x, y) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = x + 'px';
  p.style.top = y + 'px';
  particles.appendChild(p);
  const angle = Math.random() * Math.PI * 2;
  const dist = 20 + Math.random() * 40;
  const tx = x + Math.cos(angle) * dist;
  const ty = y + Math.sin(angle) * dist;
  p.animate([
    { left: x + 'px', top: y + 'px', opacity: 1 },
    { left: tx + 'px', top: ty + 'px', opacity: 0 }
  ], { duration: 600, easing: 'ease-out' }).onfinish = () => p.remove();
}
</script>
</body>
</html>
