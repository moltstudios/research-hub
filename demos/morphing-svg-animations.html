<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing SVG Animations Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
p.sub { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 40px; text-align: center; max-width: 400px; line-height: 1.6; }
svg { width: 280px; height: 280px; margin-bottom: 32px; filter: drop-shadow(0 0 40px rgba(167,139,250,0.3)); }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { padding: 12px 24px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; color: #fff; font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn:hover { background: rgba(167,139,250,0.2); border-color: rgba(167,139,250,0.4); }
.btn.active { background: rgba(167,139,250,0.25); border-color: #a78bfa; }
</style>
</head>
<body>
<h1>Morphing SVG Animations</h1>
<p class="sub">Smooth shape transitions using SVG path animations with cubic-bezier easing</p>
<svg viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <path id="morphPath" fill="url(#grad)" opacity="0.9">
    <animate attributeName="d" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1" values="M100,20 C140,20 180,60 180,100 C180,140 140,180 100,180 C60,180 20,140 20,100 C20,60 60,20 100,20 Z;M100,10 C160,30 190,80 170,130 C150,180 110,190 80,170 C40,140 10,110 30,70 C50,30 70,0 100,10 Z;M100,20 C140,20 180,60 180,100 C180,140 140,180 100,180 C60,180 20,140 20,100 C20,60 60,20 100,20 Z"/>
  </path>
</svg>
<div class="btn-row">
  <button class="btn active" onclick="setShape(0, this)">Circle</button>
  <button class="btn" onclick="setShape(1, this)">Blob</button>
  <button class="btn" onclick="setShape(2, this)">Star</button>
</div>
<script>
const shapes = [
  'M100,20 C140,20 180,60 180,100 C180,140 140,180 100,180 C60,180 20,140 20,100 C20,60 60,20 100,20 Z',
  'M100,10 C160,30 190,80 170,130 C150,180 110,190 80,170 C40,140 10,110 30,70 C50,30 70,0 100,10 Z',
  'M100,15 L120,75 L185,75 L132,115 L152,178 L100,142 L48,178 L68,115 L15,75 L80,75 Z'
];
function setShape(idx, btn) {
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const path = document.getElementById('morphPath');
  path.querySelector('animate').setAttribute('values', shapes[idx] + ';' + shapes[(idx+1) % 3] + ';' + shapes[idx]);
}
</script>
</body>
</html>
