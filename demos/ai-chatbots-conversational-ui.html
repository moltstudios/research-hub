<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbots & Conversational UI Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#f0f0f5;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.chat-container{width:100%;max-width:400px;background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,0.1);overflow:hidden}
.chat-header{background:linear-gradient(135deg,#8b5cf6,#6366f1);padding:20px;color:#fff}
.chat-header h3{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.status{width:8px;height:8px;background:#10b981;border-radius:50%}
.chat-body{height:320px;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.message{max-width:80%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.4;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message.bot{background:#f0f0f5;color:#1a1a1a;align-self:flex-start;border-bottom-left-radius:4px}
.message.user{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.typing{display:flex;gap:4px;padding:12px 16px;background:#f0f0f5;border-radius:16px;border-bottom-left-radius:4px;align-self:flex-start;width:fit-content}
.typing span{width:6px;height:6px;background:#999;border-radius:50%;animation:bounce 1.4s ease infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.chat-input{padding:12px;border-top:1px solid #e5e7eb;display:flex;gap:8px}
.chat-input input{flex:1;padding:10px 14px;border:1px solid #e5e7eb;border-radius:20px;font-size:14px;outline:none}
.chat-input button{width:40px;height:40px;background:#8b5cf6;border:none;border-radius:50%;color:#fff;font-size:16px;cursor:default;display:flex;align-items:center;justify-content:center}
.quick-replies{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.quick-btn{padding:6px 14px;background:#f0f0f5;border:none;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;cursor:default;transition:background .2s}
.quick-btn:hover{background:#e5e7eb}
</style>
</head>
<body>
<div class="chat-container">
<div class="chat-header">
<h3><div class="status"></div> AI Assistant</h3>
</div>
<div class="chat-body" id="chatBody">
<div class="message bot">Hi! I'm your AI assistant. How can I help you today?</div>
</div>
<div class="quick-replies">
<button class="quick-btn" onclick="sendMsg('Tell me about your services')">Services</button>
<button class="quick-btn" onclick="sendMsg('Pricing info')">Pricing</button>
<button class="quick-btn" onclick="sendMsg('Contact support')">Support</button>
</div>
<div class="chat-input">
<input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
</div>
<script>
const responses = {
'services':'We offer AI automation, web development, and digital transformation services. What interests you?',
'pricing':'Our plans start at $500/month for small teams. Enterprise plans are custom. Want a quote?',
'support':'You can reach our support team at support@demo.com or use this chat 24/7.',
'default':'I\'m here to help! Try asking about our services, pricing, or support options.'
};
const chatBody = document.getElementById('chatBody');
const input = document.getElementById('userInput');
function addMsg(text,isUser){const m=document.createElement('div');m.className='message '+ (isUser?'user':'bot');m.textContent=text;chatBody.appendChild(m);chatBody.scrollTop=chatBody.scrollHeight}
function sendMsg(text){addMsg(text,true);setTimeout(()=>{const r=responses[text]||responses.default;const t=document.createElement('div');t.className='typing';t.innerHTML='<span></span><span></span><span></span>';chatBody.appendChild(t);chatBody.scrollTop=chatBody.scrollHeight;setTimeout(()=>{t.remove();addMsg(r,false)},1500)},300)}
function send(){const v=input.value.trim();if(v){sendMsg(v);input.value=''}}
</script>
</body>
</html>
