<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History Lab Child</title>
<link rel="icon" href="data:,">
<style>
  html,body { margin:0; padding:0; height:100%; }
  body { background:#0f172a; color:#e2e8f0; font:13px/1.6 ui-monospace,'SF Mono',Menlo,monospace; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; padding:12px; }
  .lab { font-size:10px; letter-spacing:.22em; color:#7dd3fc; text-transform:uppercase; }
  #u { font-size:11.5px; color:#94a3b8; word-break:break-all; max-width:92%; }
  .st { font-size:11.5px; color:#a5b4fc; }
</style>
</head>
<body>
  <div class="lab">child session</div>
  <div id="u">…</div>
  <div class="st" id="st">state: null</div>
  <script>
    window.__log = [];
    addEventListener('popstate', e => window.__log.push({ k:'popstate', t: performance.now(), state: JSON.stringify(e.state) }));
    addEventListener('hashchange', e => window.__log.push({ k:'hashchange', t: performance.now(), old:(e.oldURL||'').slice(-18), nw:(e.newURL||'').slice(-18) }));
    const paint = () => {
      document.getElementById('u').textContent = location.href.length > 46 ? '…' + location.href.slice(-44) : location.href;
      const s = history.state;
      document.getElementById('st').textContent = 'state: ' + (s === null ? 'null' : JSON.stringify(s).slice(0, 40));
    };
    addEventListener('popstate', paint); paint();
  </script>
</body>
</html>
