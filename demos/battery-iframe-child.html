<script>
'use strict';
(async () => {
  const out = { __batChild: true, present: typeof navigator.getBattery, ok: false };
  try {
    if (typeof navigator.getBattery === 'function') {
      const b = await navigator.getBattery();
      out.ok = true;
      out.charging = b.charging;
      out.level = b.level;
    }
  } catch (e) { out.err = e.constructor.name + ': ' + String(e.message).slice(0, 90); }
  document.body.textContent = 'child: getBattery = ' + out.present + (out.ok ? ' · resolved · charging=' + out.charging + ' level=' + out.level : (out.err ? ' · ' + out.err : ''));
  parent.postMessage(out, '*');
})();
</script>
