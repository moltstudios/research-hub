<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claymorphism Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #e8ddd3; color: #2d2d2d; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.container { max-width: 480px; width: 100%; }
h1 { text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 8px; color: #3d3d3d; }
p.sub { text-align: center; font-size: 14px; color: #888; margin-bottom: 32px; }
.clay { background: #e8ddd3; border-radius: 24px; padding: 32px; box-shadow: 8px 8px 16px #c4b9af, -8px -8px 16px #fff; margin-bottom: 24px; transition: all 0.3s; }
.clay:hover { box-shadow: 10px 10px 20px #c4b9af, -10px -10px 20px #fff; }
.clay h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.clay p { font-size: 14px; color: #666; line-height: 1.6; }
.clay-input { width: 100%; padding: 16px 20px; background: #e8ddd3; border: none; border-radius: 16px; box-shadow: inset 4px 4px 8px #c4b9af, inset -4px -4px 8px #fff; font-size: 15px; color: #3d3d3d; outline: none; margin-bottom: 16px; }
.clay-input::placeholder { color: #aaa; }
.clay-btn { padding: 14px 32px; background: #e8ddd3; border: none; border-radius: 16px; box-shadow: 6px 6px 12px #c4b9af, -6px -6px 12px #fff; font-size: 15px; font-weight: 600; color: #3d3d3d; cursor: pointer; transition: all 0.2s; }
.clay-btn:hover { box-shadow: 4px 4px 8px #c4b9af, -4px -4px 8px #fff; }
.clay-btn:active { box-shadow: inset 4px 4px 8px #c4b9af, inset -4px -4px 8px #fff; }
.clay-card-row { display: flex; gap: 16px; margin-top: 8px; }
.clay-mini { flex: 1; background: #e8ddd3; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 6px 6px 12px #c4b9af, -6px -6px 12px #fff; }
.clay-mini .emoji { font-size: 28px; margin-bottom: 8px; }
.clay-mini .label { font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="container">
  <h1>Claymorphism</h1>
  <p class="sub">Soft, inflated UI with inner &amp; outer shadows</p>
  <div class="clay">
    <h3>👋 Welcome Back</h3>
    <p>Sign in to continue your journey with our beautifully crafted interface.</p>
    <input class="clay-input" placeholder="Email address" style="margin-top: 16px;">
    <input class="clay-input" type="password" placeholder="Password">
    <button class="clay-btn">Sign In</button>
  </div>
  <div class="clay-card-row">
    <div class="clay-mini"><div class="emoji">🎨</div><div class="label">Design</div></div>
    <div class="clay-mini"><div class="emoji">⚡</div><div class="label">Speed</div></div>
    <div class="clay-mini"><div class="emoji">🔒</div><div class="label">Secure</div></div>
  </div>
</div>
</body>
</html>
