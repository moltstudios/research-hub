<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>netinfo child</title>
<link rel="icon" href="data:,">
</head>
<body style="font:12px/1.6 -apple-system,sans-serif;margin:0;padding:8px;color:#57534e;background:#fff">
<p style="margin:0 0 4px"><b>cross-origin child</b> — reads its own <code>navigator.connection</code></p>
<script>
(function(){
  var c = navigator.connection;
  // loaded ping FIRST, report SECOND — never conflate the handshake with the payload
  parent.postMessage({ __netinfoChildLoaded: true }, '*');
  function report(){
    if (!c) { parent.postMessage({ __netinfoChild: { present:false, onLine: navigator.onLine } }, '*'); return; }
    parent.postMessage({ __netinfoChild: {
      present:true, effectiveType:c.effectiveType, type:c.type, downlink:c.downlink,
      rtt:c.rtt, saveData:c.saveData, onLine:navigator.onLine } }, '*');
  }
  report();
  if (c) c.addEventListener('change', report);
  window.addEventListener('online', report);
  window.addEventListener('offline', report);
})();
</script>
</body>
</html>
