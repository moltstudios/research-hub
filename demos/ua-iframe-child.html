<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ua child</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; padding: 10px; }
  #cpad { background: #dfd; border: 2px solid #8b8; border-radius: 10px; padding: 18px; text-align: center; font-weight: 700; cursor: pointer; user-select: none; }
  .tiny { color: #667; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div id="cpad">CHILD PAD — click me (child frame)</div>
<div class="tiny" id="who">…</div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var cross = q.get('cross') === '1' || (location.host === 'lab.ghostsandbox.dev' || location.host === 'molt-research.vercel.app');
  var birth = q.get('birth') === '1';
  function flags() { var u = navigator.userActivation || {}; return { a: !!u.isActive, b: !!u.hasBeenActive }; }
  function send(tag, targetWin, extra) {
    var m = { src: birth ? 'uabirth' : 'uachild', tag: tag, cross: cross };
    Object.assign(m, flags(), extra || {});
    try { (targetWin || (birth ? opener : parent)).postMessage(m, '*'); } catch (e) { }
  }
  document.getElementById('who').textContent = (cross ? 'cross-origin child · ' : 'same-origin child · ') + location.host;
  document.getElementById('cpad').addEventListener('click', function () { send('click'); });
  window.addEventListener('message', function (e) { if (e.data === 'PING') send('ping'); });
  if (birth) { send('birth', opener); setTimeout(function () { send('birth2', opener); }, 1200); }
  else { setTimeout(function () { send('load'); }, 50); }
})();
</script>
</body>
</html>
