<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll-Driven Dual-Wave Text Animation Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#0a0a1a;color:#fff;min-height:200vh}
.hero{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;position:sticky;top:0}
.hero h1{font-size:clamp(28px,6vw,56px);font-weight:800;line-height:1.1;margin-bottom:16px}
.wave-text{display:inline-block}
.wave-text .char{display:inline-block;animation:wave 2s ease-in-out infinite;color:rgba(255,255,255,0.3)}
.wave-text .char:nth-child(odd){color:#a78bfa}
.wave-text .char:nth-child(even){color:#60a5fa}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.hero p{font-size:15px;color:rgba(255,255,255,0.4);max-width:400px;margin-top:16px}
.hint{margin-top:40px;font-size:12px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:2px}
.wave-container{position:fixed;bottom:0;left:0;right:0;height:200px;overflow:hidden;pointer-events:none}
.wave{position:absolute;bottom:0;width:200%;height:100%;opacity:0.3}
.wave1{background:linear-gradient(90deg,#a78bfa,transparent);animation:waveMove 8s linear infinite;animation-delay:0s}
.wave2{background:linear-gradient(90deg,#60a5fa,transparent);animation:waveMove 6s linear infinite;animation-delay:-2s}
@keyframes waveMove{from{transform:translateX(-50%)}to{transform:translateX(0)}}
</style>
</head>
<body>
<div class="hero">
<h1 class="wave-text" id="wave1">BUILDING THE</h1>
<h1 class="wave-text" id="wave2">FUTURE</h1>
<p>Dual-wave animation that creates a mesmerizing scroll effect</p>
<div class="hint">Scroll to see the waves move</div>
</div>
<div class="wave-container">
<div class="wave wave1"></div><div class="wave wave2"></div>
</div>
<script>
['wave1','wave2'].forEach((id, waveIdx) => {
  const el = document.getElementById(id);
  const text = el.textContent;
  el.textContent = '';
  text.split('').forEach((char, i) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = char === ' ' ? '\u00A0' : char;
    span.style.animationDelay = (i * 0.1 + waveIdx * 0.5) + 's';
    el.appendChild(span);
  });
});
window.addEventListener('scroll', () => {
  const progress = window.scrollY / (document.body.scrollHeight - window.innerHeight);
  document.querySelectorAll('.wave').forEach((wave, i) => {
    const speed = 100 + i * 50;
    wave.style.transform = `translateX(${-50 + progress * speed}%)`;
  });
});
</script>
</body>
</html>
