<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion-Driven Branding Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.container{max-width:540px;width:90%;text-align:center}
.logo-stage{width:200px;height:200px;margin:0 auto 32px;position:relative}
.orb{position:absolute;width:60px;height:60px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);filter:blur(0)}
.orb:nth-child(1){width:120px;height:120px;background:rgba(167,139,250,0.2);animation:expand 4s ease-in-out infinite}
.orb:nth-child(2){width:90px;height:90px;background:rgba(96,165,250,0.25);animation:expand 4s ease-in-out infinite 0.5s}
.orb:nth-child(3){width:60px;height:60px;background:rgba(244,114,182,0.3);animation:expand 4s ease-in-out infinite 1s}
.orb:nth-child(4){width:30px;height:30px;background:#fff;animation:expand 4s ease-in-out infinite 1.5s}
@keyframes expand{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.brand-name{font-size:36px;font-weight:800;letter-spacing:-1px;position:relative;z-index:10}
.brand-name span{display:inline-block;animation:letterPulse 2s ease-in-out infinite}
.brand-name span:nth-child(1){animation-delay:0s}.brand-name span:nth-child(2){animation-delay:0.1s}
.brand-name span:nth-child(3){animation-delay:0.2s}.brand-name span:nth-child(4){animation-delay:0.3s}
.brand-name span:nth-child(5){animation-delay:0.4s}.brand-name span:nth-child(6){animation-delay:0.5s}
.brand-name span:nth-child(7){animation-delay:0.6s}
@keyframes letterPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tagline{font-size:14px;color:rgba(255,255,255,0.5);margin-top:12px;opacity:0;animation:fadeIn 1s ease forwards 0.5s}
@keyframes fadeIn{to{opacity:1}}
.cta{display:inline-block;margin-top:32px;padding:14px 32px;background:linear-gradient(135deg,#a78bfa,#60a5fa);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:default;opacity:0;animation:fadeIn 1s ease forwards 1s;transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="container">
<div class="logo-stage">
<div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div>
</div>
<div class="brand-name"><span>A</span><span>U</span><span>R</span><span>A</span><span>Flow</span></div>
<div class="tagline">Motion that tells your story</div>
<a class="cta">Explore</a>
</div>
</body>
</html>
