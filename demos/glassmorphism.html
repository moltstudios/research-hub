<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; min-height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.bg-shapes { position: fixed; inset: 0; z-index: 0; }
.shape { position: absolute; border-radius: 50%; }
.shape:nth-child(1) { width: 300px; height: 300px; background: rgba(255,255,255,0.1); top: -50px; right: -50px; }
.shape:nth-child(2) { width: 200px; height: 200px; background: rgba(244,114,182,0.3); bottom: -30px; left: -30px; }
.shape:nth-child(3) { width: 150px; height: 150px; background: rgba(52,211,153,0.2); top: 40%; left: 20%; }
.glass-card { position: relative; z-index: 1; background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.25); border-radius: 24px; padding: 40px; max-width: 420px; width: 90%; color: #fff; }
.glass-card h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.glass-card p { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 24px; line-height: 1.6; }
.glass-input { width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: #fff; font-size: 14px; outline: none; margin-bottom: 12px; transition: background 0.2s; }
.glass-input::placeholder { color: rgba(255,255,255,0.5); }
.glass-input:focus { background: rgba(255,255,255,0.2); }
.glass-btn { width: 100%; padding: 14px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.glass-btn:hover { background: rgba(255,255,255,0.35); transform: translateY(-1px); }
.divider { text-align: center; margin: 16px 0; font-size: 12px; color: rgba(255,255,255,0.4); }
.social-row { display: flex; gap: 12px; }
.social-btn { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 13px; text-align: center; cursor: pointer; transition: background 0.2s; }
.social-btn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="bg-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>
<div class="glass-card">
  <h1>Welcome Back ✨</h1>
  <p>Sign in to your account with frosted glass UI.</p>
  <input class="glass-input" placeholder="Email address">
  <input class="glass-input" type="password" placeholder="Password">
  <button class="glass-btn">Sign In</button>
  <div class="divider">or continue with</div>
  <div class="social-row">
    <div class="social-btn">Google</div>
    <div class="social-btn">GitHub</div>
    <div class="social-btn">Apple</div>
  </div>
</div>
</body>
</html>
