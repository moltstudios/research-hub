<!doctype html>
<meta charset="utf-8">
<title>fm samesite helper</title>
<!--
  Fetch Metadata — same-site helper.
  Loaded as a cross-origin iframe by fetch-metadata-tier.html.
  It runs on a sibling origin (lab.ghostsandbox.dev / echo.ghostsandbox.dev) so that,
  relative to the parent page, its own requests land on a SAME-SITE (not cross-site) origin.
  It measures and posts the result back to the parent via postMessage.
-->
<div id="s" style="font:12px/1.5 ui-monospace,monospace;padding:8px">fm samesite helper</div>
<script>
(function () {
  var ECHO = location.origin + '/api/fm';
  var CROSS = 'https://httpbin.org/anything';

  function post(obj) {
    obj.__fm = 1;
    try { parent.postMessage(obj, '*'); } catch (e) {}
  }

  function pick(o, k) {
    if (!o) return null;
    var v = o[k];
    if (v === undefined) {
      var keys = Object.keys(o);
      for (var i = 0; i < keys.length; i++) {
        if (keys[i].toLowerCase() === k.toLowerCase()) return o[keys[i]];
      }
      return null;
    }
    if (Array.isArray(v)) return v[0];
    return v;
  }

  function secOf(payload) {
    var h = payload.allHeaders || payload.headers || {};
    return {
      site: pick(h, 'sec-fetch-site'),
      mode: pick(h, 'sec-fetch-mode'),
      dest: pick(h, 'sec-fetch-dest'),
      user: pick(h, 'sec-fetch-user'),
      purpose: pick(h, 'sec-purpose'),
      priority: pick(h, 'priority')
    };
  }

  function step(n, fn) {
    return Promise.resolve().then(fn).then(function (v) {
      return { name: n, ok: true, value: v };
    }).catch(function (e) {
      return { name: n, ok: false, error: (e && e.name) || String(e) };
    });
  }

  function run() {
    var results = [];

    function add(p) {
      return function (v) { results.push(v); return v; };
    }

    var chain = Promise.resolve();

    chain = chain.then(step('self-origin', function () { return location.origin; })).then(add());
    chain = chain.then(step('same-origin-fetch', function () {
      return fetch(ECHO + '?from=helper-same-origin').then(function (r) { return r.json(); }).then(secOf);
    })).then(add());
    chain = chain.then(step('sibling-origin-fetch', function () {
      // echo.ghostsandbox.dev is a SIBLING of lab.ghostsandbox.dev -> same registrable domain.
      var sib = location.hostname.indexOf('lab.') === 0
        ? location.origin.replace('//lab.', '//echo.')
        : location.origin.replace('//echo.', '//lab.');
      return fetch(sib + '/api/fm?from=helper-sibling').then(function (r) { return r.json(); }).then(secOf)
        .catch(function (e) { return { err: e.name }; });
    })).then(add());
    chain = chain.then(step('cross-origin-fetch', function () {
      return fetch(CROSS + '?from=helper').then(function (r) { return r.json(); }).then(function (j) {
        var h = j.headers || {};
        return {
          site: pick(h, 'Sec-Fetch-Site'),
          mode: pick(h, 'Sec-Fetch-Mode'),
          dest: pick(h, 'Sec-Fetch-Dest'),
          priority: pick(h, 'Priority')
        };
      });
    })).then(add());
    chain = chain.then(step('image', function () {
      return new Promise(function (resolve) {
        var i = new Image();
        i.onload = function () { resolve('loaded'); };
        i.onerror = function () { resolve('error'); };
        i.src = ECHO + '?from=helper-image&t=' + Date.now();
        setTimeout(function () { resolve('timeout'); }, 4000);
      });
    })).then(add());

    chain.then(function () {
      document.getElementById('s').textContent = 'fm samesite helper: done (' + results.length + ' lanes)';
      post({ type: 'fm-results', results: results, helperOrigin: location.origin, at: Date.now() });
    });
    return chain;
  }

  var ran = false;
  function once() { if (!ran) { ran = true; run(); } }
  window.addEventListener('message', function (ev) {
    if (ev.data && ev.data.__fmPing) once();
  });
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(once, 30);
  else window.addEventListener('DOMContentLoaded', once);
})();
</script>
