<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Grid Scroll Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#0a0a1a;color:#fff}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.hero h1{font-size:clamp(32px,7vw,56px);font-weight:800;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.hero p{font-size:15px;color:rgba(255,255,255,0.5);max-width:420px}
.scroll-section{min-height:300vh;position:relative}
.sticky-wrap{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.grid-container{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:540px;width:90%;padding:24px;transition:transform .1s ease-out}
.grid-item{aspect-ratio:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;transition:all .3s}
.grid-item:nth-child(odd){background:rgba(167,139,250,0.08);border-color:rgba(167,139,250,0.2)}
.grid-item:nth-child(even){background:rgba(96,165,250,0.08);border-color:rgba(96,165,250,0.2)}
.grid-item.visible{opacity:1;transform:scale(1)}
.grid-item.hidden{opacity:0.2;transform:scale(0.8)}
.outro{min-height:50vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.outro h2{font-size:28px;font-weight:700}
</style>
</head>
<body>
<section class="hero">
<h1>Sticky Grid Scroll</h1>
<p>Scroll to see the grid animate and reveal items progressively</p>
<div style="margin-top:40px;font-size:24px;animation:bounce 2s infinite">↓</div>
</section>
<section class="scroll-section">
<div class="sticky-wrap">
<div class="grid-container" id="grid">
<div class="grid-item">🎨</div><div class="grid-item">⚡</div><div class="grid-item">🚀</div>
<div class="grid-item">💎</div><div class="grid-item">✨</div><div class="grid-item">🔥</div>
<div class="grid-item">🎯</div><div class="grid-item">🌟</div><div class="grid-item">💫</div>
</div>
</div>
</section>
<section class="outro">
<h2>✨ Smooth Scroll Effect</h2>
</section>
<style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}</style>
<script>
const grid = document.getElementById('grid');
const items = grid.querySelectorAll('.grid-item');
window.addEventListener('scroll', () => {
  const section = document.querySelector('.scroll-section');
  const rect = section.getBoundingClientRect();
  const progress = Math.min(Math.max(-rect.top / (section.offsetHeight - window.innerHeight), 0), 1);
  const rotate = progress * 15;
  grid.style.transform = `perspective(1000px) rotateX(${rotate}deg) rotateY(${rotate * 0.5}deg)`;
  items.forEach((item, i) => {
    const itemProgress = (progress * items.length) - i;
    if (itemProgress >= 0 && itemProgress <= 1) {
      item.className = 'grid-item visible';
      item.style.opacity = itemProgress;
      item.style.transform = `scale(${0.8 + itemProgress * 0.2})`;
    } else if (itemProgress < 0) {
      item.className = 'grid-item hidden';
      item.style.opacity = 0.2;
      item.style.transform = 'scale(0.8)';
    } else {
      item.className = 'grid-item visible';
      item.style.opacity = 1;
      item.style.transform = 'scale(1)';
    }
  });
});
</script>
</body>
</html>
