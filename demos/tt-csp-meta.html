<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'">
<title>Child C — meta-delivered CSP</title>
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, monospace; padding: 12px 14px; background: #fff; color: #333; }
  .tag { display: inline-block; font: 700 10px/1 system-ui; padding: 3px 8px; border-radius: 999px; background: #fbf3e2; color: #9a6b0f; }
  .r { margin-top: 4px; color: #555; }
</style>
</head>
<body>
<div class="tag">meta http-equiv CSP: require-trusted-types-for 'script' — ignored?</div>
<div class="r" id="out">running…</div>
<script>
(() => {
'use strict';
const out = document.getElementById('out');
function run() {
  let res;
  try {
    const d = document.createElement('div');
    d.innerHTML = '<i>meta-probe</i>';
    res = (d.firstChild && d.firstChild.nodeName === 'I')
      ? 'worked — raw string parsed (directive IGNORED in meta delivery)'
      : 'no-throw but empty';
  } catch (e) { res = e.name + ': ' + String(e.message).slice(0, 70); }
  out.textContent = res;
  parent.postMessage({ kind: 'tt-child-C', results: { rawInnerHTML: res } }, '*');
}
window.addEventListener('load', run);
})();
</script>
</body>
</html>
