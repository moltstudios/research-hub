<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geolocation frame child</title>
<link rel="icon" href="data:,">
<style>
  body { font: 12.5px/1.5 ui-monospace, monospace; padding: 10px 14px; background: #fff; color: #333; margin: 0; }
  .st { padding: 2px 8px; border-radius: 6px; font-weight: 700; }
  .ok { background: #e8f4ec; color: #2e7d4f; } .no { background: #fbe9e7; color: #b3352c; }
</style>
</head>
<body>
<div id="line">child boot…</div>
<script>
'use strict';
const tag = new URLSearchParams(location.search).get('tag') || 'so';
const post = obj => { try { parent.postMessage(Object.assign({ geo: 1, tag }, obj), '*'); } catch (e) {} };
const line = document.getElementById('line');
function render(t, cls) { line.innerHTML = `[${tag}] ${t}`; }
post({ secure: window.isSecureContext, hasGeo: typeof navigator.geolocation !== 'undefined' });
(async () => {
  if (!navigator.geolocation) {
    render('navigator.geolocation ABSENT (insecure origin)', 'no');
    post({ result: { ok: false, code: 'absent' } });
    return;
  }
  render('requesting…');
  try {
    const p = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 4000, maximumAge: 0 }));
    post({ result: { ok: true, lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy } });
    render('fix ' + p.coords.latitude.toFixed(5) + ',' + p.coords.longitude.toFixed(5) + ' ±' + Math.round(p.coords.accuracy) + 'm', 'ok');
  } catch (e) {
    post({ result: { ok: false, code: e.code, msg: e.message } });
    render('DENIED code ' + e.code + ' (' + (e.message || '').slice(0, 60) + ')', 'no');
  }
})();
</script>
</body>
</html>
