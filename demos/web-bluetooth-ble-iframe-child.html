<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BLE iframe child</title></head>
<body>
<script>
'use strict';
addEventListener('unhandledrejection', e => e.preventDefault());
(async () => {
  const id = new URLSearchParams(location.search).has('allow') ? 'crossAllow'
           : new URLSearchParams(location.search).has('x') ? 'cross' : 'same';
  const r = { __bleChild: true, id, href: location.href, bt: typeof navigator.bluetooth };
  try { r.avail = await Promise.race([navigator.bluetooth.getAvailability(), new Promise(res => setTimeout(() => res('PEND'), 1500))]); }
  catch(e){ r.avail = e.name; }
  try { const d = await Promise.race([navigator.bluetooth.getDevices(), new Promise(res => setTimeout(() => res('PEND'), 1500))]);
        r.gd = Array.isArray(d) ? '[]:' + d.length : String(d); }
  catch(e){ r.gd = e.name + ' ' + String(e.message).slice(0, 80); }
  try {
    const p = navigator.bluetooth.requestDevice({ filters: [{ services: ['battery_service'] }] });
    r.rd = 'PEND(no gesture)';
    p.catch(e => { r.rd = e.name + ' · ' + String(e.message).slice(0, 90); parent.postMessage({ ...r }, '*'); })
     .catch(() => {});
  } catch(e){ r.rd = e.name + ' · ' + String(e.message).slice(0, 90); }
  parent.postMessage(r, '*');
})();
</script>
</body>
</html>
