<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Gradient Mesh Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; min-height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.mesh { position: fixed; inset: 0; background: #0a0a1a; }
.mesh::before, .mesh::after { content: ''; position: absolute; border-radius: 50%; filter: blur(80px); animation: drift 8s ease-in-out infinite alternate; }
.mesh::before { width: 60vw; height: 60vw; max-width: 500px; max-height: 500px; background: radial-gradient(circle, rgba(167,139,250,0.6), transparent 70%); top: -10%; left: -10%; }
.mesh::after { width: 50vw; height: 50vw; max-width: 450px; max-height: 450px; background: radial-gradient(circle, rgba(96,165,250,0.5), transparent 70%); bottom: -10%; right: -10%; animation-delay: -4s; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: drift 10s ease-in-out infinite alternate; }
.orb:nth-child(2) { width: 40vw; height: 40vw; max-width: 350px; max-height: 350px; background: radial-gradient(circle, rgba(244,114,182,0.4), transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -2s; }
.orb:nth-child(3) { width: 30vw; height: 30vw; max-width: 280px; max-height: 280px; background: radial-gradient(circle, rgba(52,211,153,0.3), transparent 70%); top: 20%; right: 20%; animation-delay: -6s; }
@keyframes drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, -40px) scale(1.1); } }
.content { position: relative; z-index: 1; text-align: center; color: #fff; padding: 24px; max-width: 540px; }
h1 { font-size: 42px; font-weight: 800; margin-bottom: 16px; background: linear-gradient(135deg, #fff, rgba(255,255,255,0.7)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { font-size: 16px; color: rgba(255,255,255,0.6); line-height: 1.6; }
</style>
</head>
<body>
<div class="mesh"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="content">
  <h1>Animated Gradient Mesh</h1>
  <p>Organic, flowing color fields created with layered radial gradients and CSS blur filters. Move your mouse to see the effect.</p>
</div>
</body>
</html>
